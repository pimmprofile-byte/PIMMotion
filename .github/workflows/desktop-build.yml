name: desktop-build

# PIMM Launcher 듀얼빌드: 윈도우(.exe) + 맥(.dmg). 무서명 내부배포.
# 트리거: 'desktop-v*' 태그 push 또는 수동 실행.
# 태그 push 시 해당 Release 에 설치파일 첨부(+ 아티팩트 업로드).
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write   # 태그 Release 에 설치파일 첨부

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: '--win'
          - os: macos-latest
            target: '--mac'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: pimm-launcher-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: warn
      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.dmg
          fail_on_unmatched_files: false
