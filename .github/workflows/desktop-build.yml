name: desktop-build

# 데스크톱 앱 듀얼빌드: 윈도우(.exe) + 맥(.dmg). 무서명 내부배포.
# 트리거: 'desktop-v*' 태그 push 또는 수동 실행. (기능 프리즈 후 2.0에서 사용)
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: '--win'
          - os: macos-latest
            target: '--mac'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run sync           # tool/ 최신 에디터 → renderer/index.html
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pimmotion-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
          if-no-files-found: warn
