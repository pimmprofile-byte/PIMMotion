<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIMM POFFICE · 워크스페이스 v0.11</title>
<style>
/* ============================================================
   PIMM POFFICE v0.9 — 개인 워크스페이스 (읽기 전용 + 체크/메모)
   · 진입 시 인물 선택 → 본인 것만. (선택 이름 = 로컬 config)
   · 기존 피모션(네온 터미널)과 다른 '차분한 다크 워크스페이스' 톤, 도식 우선.
   · 미션 = 마일스톤 트랙(Day char 전진) / 게이트 = 권한 신호등 / 투두 = 체크리스트
   · 세션로그 = 시간순, 오래될수록 흐림(opacity), 드롭다운.
   · 로컬 인터랙션 = 체크 + 메모. export만(허브→코워크). 원본 불변.
   · v0.3: '코워크 소통 가이드' 패널 신설 (핵심 3문장 + [더보기]).
   · v0.4: 가이드를 최상단으로 이동 + 패널 전체 접기/펴기(접혀도 핵심 3마디 teaser 노출) + 더보기 문구를 쉬운 말로 재작성.
   · v0.5: 상단 연동상태(최신 세션로그 ts + 신선도 + 새로고침).
   · v0.6: 미션 트랙 Day 스프라이트를 정본 charC로 교체 + 세션로그 원문(raw) 표시 + 가이드 문구 정정(연동상태는 상단).
   · v0.7: 데이터 로드에 poffice_board.js(script 태그) 우선 추가 → file:// 더블클릭에서도 자동 로드(.json fetch·드래그·샘플 폴백 유지).
   · v0.8: 샘플 폴백 경고 배너 + raw_omitted(원문 생략) 표시 + 스키마 version 가드. (코워크 마더로그 인계 반영)
   · v0.9: 사내공지 notices[] 최상단 렌더(②) + 연동상태 칩을 generated_at(보드 생성시각·KST) 기준으로(신호등도)·latestLogTs는 툴팁·구board 폴백(⑤).
   · v0.9 핫픽스(2026-07-27): 동적 주입 script에 charset="utf-8" 지정 — file:// 더블클릭 시 .js 이모지(🔴🟡🟢) latin-1 폴백으로 깨지던 것 수정. + notices level 색/by.
   · v0.10: 미션 트랙 Day 캐릭터를 정면 정지(charC)에서 달리기 애니메이션으로 교체 — charL↔charR 2프레임 스왑으로 목표(🚩)를 향해 오른쪽으로 달려감. 걸음마다 바운스(bob)를 넣어 툭툭 끊기지 않고 자연스럽게. 캐릭터를 레일 위에 착지시키고(top 정렬) 골(🚩) 좌표를 레일 오른쪽 끝에 정확히 정렬. reduced-motion 시 charC 고정.
   · v0.11: (1) Day 캐릭터 좌우반전(scaleX(-1))으로 진행 방향과 시선 일치. (2) 마일스톤 노드 라벨을 '짧은 단계 배지(순번·완료✓, 길이 고정)'로 바꿔 서로 침범하던 문제 해결 — 실제 단계명은 노드에 마우스 올리면(또는 포커스 시) 불투명 툴팁으로 전체 노출. 시인성 위해 테두리·그림자·화살표·줄바꿈 처리.
   ============================================================ */
:root{
  --bg:#0f1115; --bg2:#0c0e12; --panel:#161922; --panel2:#1b1f2a; --raise:#20252f;
  --ink:#e9ebef; --ink2:#98a0ad; --ink3:#5c6472; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --ac:#4fd1a1;            /* 차분한 민트 액센트 (절제) */
  --red:#f2726b; --yellow:#e8b34a; --green:#4fd1a1; --blue:#6bb8ff;
  --r:14px; --rs:10px; --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',sans-serif;
  line-height:1.55;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit} h1,h2,h3,h4,p{margin:0}
.mono{font-family:var(--mono);letter-spacing:0}
button{font:inherit;cursor:pointer}

/* ===== 진입: 인물 선택 ===== */
#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
  background:radial-gradient(800px 500px at 50% 20%,rgba(79,209,161,.08),transparent 60%),var(--bg)}
#gate .logo{font-weight:800;font-size:22px;letter-spacing:-.02em}#gate .logo b{color:var(--ac)}
#gate .sub{color:var(--ink2);font-size:13px;margin-top:-14px}
#gate .who{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:560px}
#gate .who button{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;color:var(--ink);
  min-width:140px;text-align:left;transition:.2s}
#gate .who button:hover{border-color:var(--ac);transform:translateY(-3px);background:var(--panel2)}
#gate .who .nm{font-size:17px;font-weight:700}#gate .who .rl{font-size:12px;color:var(--ink3);margin-top:3px}
#gate .load{font-size:12px;color:var(--ink3)}#gate .load button{color:var(--ac);background:none;border:0;text-decoration:underline}

/* ===== 앱 셸 ===== */
#app{display:none} #app.on{display:block}
.top{position:sticky;top:0;z-index:40;background:rgba(15,17,21,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em}.brand b{color:var(--ac)}.brand .v{font-size:10.5px;color:var(--ink3);font-weight:600;margin-left:4px}
.me{display:flex;align-items:center;gap:9px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.me .dot{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.me b{font-weight:700}.me .r{color:var(--ink3);font-size:11px}
.sp{flex:1}
.tbtn{font-size:12px;font-weight:600;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;transition:.2s}
.tbtn:hover{color:var(--ink);border-color:var(--line2)}
.tbtn.ac{color:#08130f;background:var(--ac);border-color:var(--ac);font-weight:700}
.ro{font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--ac);border:1px solid rgba(79,209,161,.3);border-radius:999px;padding:3px 8px}
/* ===== 연동상태 (v0.5) — 최신 세션로그 타임스탬프 + 새로고침 ===== */
.conn{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--ink2);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;transition:.2s;font-family:inherit;white-space:nowrap}
.conn:hover{border-color:var(--line2);color:var(--ink)}
.conn:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.conn .cdot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none}
.conn.g .cdot{background:var(--green);box-shadow:0 0 6px rgba(79,209,161,.55)}
.conn.y .cdot{background:var(--yellow)}
.conn.r .cdot{background:var(--red)}
.conn .ct{color:var(--ink);font-family:var(--mono);font-size:11px}
.conn .crel{color:var(--ink3)}
.conn.y .crel{color:var(--yellow)} .conn.r .crel{color:var(--red);font-weight:700}
.conn .crf{color:var(--ac);font-weight:700;margin-left:1px}
.conn .cest{color:var(--ink3);font-weight:500;font-size:10px}
.conn.loading{opacity:.55;pointer-events:none}
/* ===== 상단 배너 (v0.8): 샘플 경고 / 스키마 버전 경고 ===== */
.appbanner{max-width:1080px;margin:14px auto -6px;padding:11px 16px;border-radius:var(--rs);font-size:12.5px;font-weight:600;line-height:1.5}
.appbanner[hidden]{display:none}
.appbanner.warn{color:var(--yellow);background:rgba(232,179,74,.1);border:1px solid rgba(232,179,74,.4)}
.appbanner.info{color:var(--blue);background:rgba(107,184,255,.08);border:1px solid rgba(107,184,255,.32)}
.appbanner b{color:var(--ink)}

.wrap{max-width:1080px;margin:0 auto;padding:24px 22px 80px}
.sec{margin:30px 0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.sec-h h2{font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;color:var(--ink)}
.sec-h .d{font-size:12px;color:var(--ink3)}
.sec-h .line{flex:1;height:1px;background:var(--line)}

/* stat header */
.hero-me{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.hero-me .big{font-size:22px;font-weight:800}.hero-me .big .r{font-size:12px;color:var(--ink3);font-weight:500;margin-left:8px}
.hero-me .rank{margin-top:8px;font-size:13px;color:var(--ac);font-weight:700}
.hero-me .rank .e{margin-right:5px}
.hero-me .stat{text-align:right}
.hero-me .stat .n{font-family:var(--mono);font-size:30px;font-weight:700}
.hero-me .stat .n small{font-size:13px;color:var(--ink3)}
.hero-me .prog{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;width:180px;margin-left:auto}
.hero-me .prog i{display:block;height:100%;background:var(--ac)}
.hero-me .next{font-size:11px;color:var(--ink3);margin-top:6px}

/* WO */
.wo{border:1px solid rgba(242,114,107,.4);background:linear-gradient(180deg,rgba(242,114,107,.08),transparent);border-radius:var(--r);padding:15px 17px;margin:18px 0}
.wo .t{font-size:11.5px;font-weight:800;letter-spacing:.08em;color:var(--red);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.wo .t::before{content:"⚡"}
.wo ul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.wo li{display:flex;gap:10px;align-items:center;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:9px 12px}
.wo li .m{margin-left:auto;font-size:11px;color:var(--ink3)}

/* 미션 마일스톤 트랙 */
.mission{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:14px}
.mission .mh{display:flex;align-items:center;gap:10px}
.mission .id{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.mission h3{font-size:16px;font-weight:700}
.pill{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-left:auto;white-space:nowrap}
.pill.예정{color:var(--ink2);background:rgba(255,255,255,.06);border:1px solid var(--line)}
.pill.진행{color:var(--ac);background:rgba(79,209,161,.12);border:1px solid rgba(79,209,161,.3)}
.pill.달성{color:#08130f;background:var(--ac)}
.pill.보류{color:var(--yellow);background:rgba(232,179,74,.12);border:1px solid rgba(232,179,74,.3)}
.mission .dday{font-size:12px;color:var(--ink2);margin-top:4px}.mission .dday b{color:var(--red)}
/* 트랙 */
.track{position:relative;margin:26px 6px 8px;height:56px}
.track .rail{position:absolute;left:0;right:0;top:38px;height:2px;background:var(--line2)}
.track .fill{position:absolute;left:0;top:38px;height:2px;background:var(--ac)}
.track .node{position:absolute;top:32px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--ink3);transform:translateX(-50%);cursor:help;outline:none}
.track .node.done{border-color:var(--ac);background:var(--ac)}
/* 짧은 단계 배지(순번) — 길이 고정이라 서로 침범 안 함. 실제 단계명은 hover 툴팁으로. */
.track .node .lbl{position:absolute;top:19px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--mono);font-size:10px;font-weight:700;line-height:16px;min-width:16px;height:16px;text-align:center;
  border-radius:8px;padding:0 5px;color:var(--ink3);background:var(--bg2);border:1px solid var(--line)}
.track .node.done .lbl{color:var(--bg);background:var(--ac);border-color:var(--ac)}
.track .node:hover .lbl,.track .node:focus-visible .lbl{border-color:var(--ac);color:var(--ac)}
.track .node.done:hover .lbl,.track .node.done:focus-visible .lbl{color:var(--bg)}
/* hover/focus 툴팁 — 실제 단계명 전체 노출(시인성: 불투명 패널+테두리+그림자, 긴 텍스트 줄바꿈) */
.track .node .tip{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(5px);
  background:var(--panel2,#171a1f);border:1px solid var(--ac);border-radius:9px;padding:7px 11px;
  font-size:12px;line-height:1.45;font-weight:600;color:var(--ink);text-align:center;
  width:max-content;max-width:190px;white-space:normal;word-break:keep-all;
  box-shadow:0 10px 28px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:9}
.track .node .tip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ac)}
.track .node:hover .tip,.track .node:focus-visible .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.track .goal{position:absolute;left:100%;top:39px;transform:translate(-2px,-100%);font-size:19px;line-height:1}
.track .char{position:absolute;top:9px;transform:translateX(-50%);transition:left .6s cubic-bezier(.22,.61,.36,1);width:26px;height:30px;z-index:2}
/* Day 달리기(오른쪽으로) — charL↔charR 2프레임 스왑 + 부드러운 바운스(bob)로 러닝감. 프레임당 바운스 1회 → 툭툭 끊김 없이 자연스럽게. */
.track .char .daywalk{position:relative;display:block;width:26px;height:30px;transform-origin:50% 100%;animation:dayrun .48s ease-in-out infinite}
.track .char .dayframe{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
.track .char .dayframeC{opacity:0}
.track .char .dayframeL{opacity:1;animation:daystepL .48s steps(1,end) infinite}
.track .char .dayframeR{opacity:0;animation:daystepR .48s steps(1,end) infinite}
@keyframes daystepL{0%,49.9%{opacity:1}50%,100%{opacity:0}}
@keyframes daystepR{0%,49.9%{opacity:0}50%,100%{opacity:1}}
/* 바운스: 프레임 교체(0%·50%)마다 착지, 그 사이(25%·75%)에 정점 → 걸음마다 통통 튀는 러닝 */
@keyframes dayrun{0%,50%,100%{transform:translateY(0) scaleY(1)}25%,75%{transform:translateY(-2.5px) scaleY(1.03)}}
@media (prefers-reduced-motion:reduce){.track .char .dayframeL,.track .char .dayframeR{animation:none;opacity:0}.track .char .dayframeC{opacity:1}.track .char .daywalk{animation:none}}
.track .pctlab{position:absolute;top:-16px;transform:translateX(-50%);font-size:10px;font-family:var(--mono);color:var(--ac)}
/* 메모 */
.memo{margin-top:14px}
.memo label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:6px}
.memo label .req{color:var(--red)}
.memo textarea{width:100%;margin-top:6px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);color:var(--ink);
  font:inherit;font-size:13px;padding:10px 12px;resize:vertical;min-height:52px;transition:border-color .2s}
.memo textarea:focus{outline:none;border-color:rgba(79,209,161,.5)}
.memo textarea.edited{border-color:rgba(79,209,161,.4)}

/* 게이트 권한 신호등 */
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gcol{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.gcol .gt{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.gcol .gt .lamp{width:11px;height:11px;border-radius:50%}
.gcol.red .lamp{background:var(--red);box-shadow:0 0 8px rgba(242,114,107,.6)} .gcol.red .gt{color:var(--red)}
.gcol.yellow .lamp{background:var(--yellow);box-shadow:0 0 8px rgba(232,179,74,.5)} .gcol.yellow .gt{color:var(--yellow)}
.gcol.green .lamp{background:var(--green);box-shadow:0 0 8px rgba(79,209,161,.5)} .gcol.green .gt{color:var(--green)}
.gcol .gt .cnt{margin-left:auto;font-family:var(--mono);color:var(--ink3);font-size:12px}
.gcol .rule{font-size:11px;color:var(--ink3);padding:6px 0 10px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.gitem{font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}.gitem:last-child{border:0}
.gitem .l1{display:flex;align-items:center;gap:7px}
.gitem .st{font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.gitem .st.완료{color:var(--green);border-color:rgba(79,209,161,.3)} .gitem .st.진행{color:var(--yellow);border-color:rgba(232,179,74,.3)}
.gitem .ts{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.gitem .log{font-size:10.5px;color:var(--ink3);margin-top:3px}
.gempty{color:var(--ink3);font-size:12px;padding:6px 0}

/* 투두 */
.todos{display:grid;gap:8px}
.todo{display:flex;align-items:flex-start;gap:11px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:var(--rs)}
.todo.wo{border-color:rgba(242,114,107,.4)}
.todo.done{opacity:.5}
.cb{width:18px;height:18px;flex:none;margin-top:1px;border:1.5px solid var(--line2);border-radius:5px;background:transparent;position:relative}
.cb:hover{border-color:var(--ac)} .cb.on{background:var(--ac);border-color:var(--ac)} .cb.on::after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:8px;border:solid #08130f;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb.doing{border-color:var(--yellow)} .cb.doing::after{content:"";position:absolute;left:3px;top:7px;width:10px;height:2px;background:var(--yellow)}
.todo .tx{font-size:14px}.todo.done .tx{text-decoration:line-through;text-decoration-color:var(--ink3)}
.todo .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.tg{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.tg.wo{color:var(--red);background:rgba(242,114,107,.12);border:1px solid rgba(242,114,107,.3)}
.tg.im{border:1px solid var(--line2);color:var(--ink2)}.tg.im.high{color:var(--red);border-color:rgba(242,114,107,.3)}
.tg.mid{color:var(--blue);border:1px solid rgba(107,184,255,.3);font-family:var(--mono)}
.tg.dt{font-family:var(--mono);color:var(--ink3);border:1px solid var(--line)}
.sortbar{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--ink3);margin-bottom:10px}
.sortbar button{font-size:11px;color:var(--ink2);background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.sortbar button.on{color:var(--ac);border-color:rgba(79,209,161,.4)}

/* 세션로그 — opacity fade + 드롭다운 */
.slog{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.slog details{border-bottom:1px solid var(--line)}
.slog details:last-child{border-bottom:0}
.slog summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 15px;background:var(--panel)}
.slog summary::-webkit-details-marker{display:none}
.slog summary .ts{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:88px}
.slog summary .sm{font-size:13.5px;font-weight:600}
.slog summary .age{margin-left:auto;font-size:10px;color:var(--ink3)}
.slog summary .cv{margin-left:8px;color:var(--ink3);transition:transform .2s}
.slog details[open] summary .cv{transform:rotate(90deg)}
.slog .body{padding:0 15px 14px;background:var(--panel)}
.slog .detail{font-size:13px;color:var(--ink2);white-space:pre-wrap;padding-top:4px}
.slog .detail.omitted{color:var(--ink3);font-style:italic;white-space:normal}
.slog .more{text-align:center;padding:12px;color:var(--ac);font-size:12px;background:var(--panel);cursor:pointer;font-weight:600}
.slog .hidden{display:none}

/* ===== 코워크 소통 가이드 (v0.4) — 상단 패널 · 전체 접기/펴기 · 쉬운 말 ===== */
/* ===== 사내공지 (v0.9 ②) — 워크스페이스 최상단 강조 카드 ===== */
.noticesec{margin:0 0 22px;display:grid;gap:10px}
.notice{background:linear-gradient(180deg,rgba(79,209,161,.09),rgba(79,209,161,.02));border:1px solid rgba(79,209,161,.4);border-radius:var(--r);padding:15px 18px}
.notice .nti{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--ac);text-transform:uppercase;display:flex;align-items:center;gap:7px}
.notice .ntt{font-size:15px;font-weight:800;color:var(--ink);margin-top:6px}
.notice .ntb{font-size:13px;color:var(--ink2);margin-top:5px;white-space:pre-wrap;line-height:1.55}
.notice .ntd{font-size:11px;color:var(--ink3);margin-top:8px;font-family:var(--mono)}
.notice.warn{background:linear-gradient(180deg,rgba(232,179,74,.1),transparent);border-color:rgba(232,179,74,.45)}
.notice.warn .nti{color:var(--yellow)}
.notice.urgent{background:linear-gradient(180deg,rgba(242,114,107,.11),transparent);border-color:rgba(242,114,107,.5)}
.notice.urgent .nti{color:var(--red)}
.guide-sec{margin:0 0 26px}
.guide{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
/* 접이식 헤더 (접혀도 항상 보임) */
.ghead{width:100%;display:flex;align-items:center;gap:12px;padding:15px 20px;background:transparent;border:0;cursor:pointer;text-align:left;color:var(--ink);font-family:inherit}
.ghead:hover{background:rgba(255,255,255,.02)}
.ghead:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.ghead .gh-ic{font-size:16px;flex:none;line-height:1}
.ghead .gh-tt{font-size:13.5px;font-weight:800;flex:none}
.ghead .gh-teaser{font-size:12px;color:var(--ink3);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghead .gh-teaser b{color:var(--ac);font-weight:700}
.ghead .gh-cv{flex:none;color:var(--ink3);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.ghead .gh-cv .ar{transition:transform .2s;display:inline-block}
.ghead[aria-expanded="true"] .gh-cv .ar{transform:rotate(180deg)}
/* 펼쳐지는 본문 */
.gpanel{padding:2px 22px 22px;border-top:1px solid var(--line)}
.gpanel[hidden]{display:none}
.guide .gnote{font-size:12px;color:var(--ink3);margin:14px 0 16px;padding-left:12px;border-left:2px solid rgba(79,209,161,.35)}
.guide .btitle{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin:0 0 10px}
/* 핵심 3마디 표 */
.gtable{width:100%;border-collapse:collapse;font-size:13px}
.gtable th{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--ink3);text-transform:uppercase;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.gtable td{padding:9px 10px;border-bottom:1px dashed var(--line);vertical-align:top;color:var(--ink2)}
.gtable tr:last-child td{border-bottom:0}
.gtable .say{color:var(--ink);font-weight:600}
.gtable .say b{color:var(--ac);font-weight:700}
.gtip{font-size:12px;color:var(--ink2);margin-top:12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 13px}
.gtip .stale{color:var(--red);font-weight:700}
/* 자세히(카드) — 패널 안에서 항상 표시 */
.gdetail{margin-top:18px;display:grid;gap:14px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--rs);padding:15px 17px}
.gcard h4{font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:5px;display:flex;align-items:center;gap:7px}
.gcard .lead{font-size:12px;color:var(--ink3);margin:0 0 11px}
.gcard.warn{border-color:rgba(232,179,74,.3);background:linear-gradient(180deg,rgba(232,179,74,.05),transparent)}
.gcard.warn h4{color:var(--yellow)}
.gcard ol,.gcard ul{margin:0;padding-left:18px;display:grid;gap:8px}
.gcard li{font-size:12.5px;color:var(--ink2);line-height:1.55}
.gcard li b{color:var(--ink);font-weight:600}
.gcard .say{color:var(--ac);font-weight:600;font-family:inherit}
.gcard code,.gcard .code{font-family:var(--mono);font-size:12px;color:var(--ac);background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
/* 대표 전용 최소 힌트 */
.gmaster{margin-top:16px;font-size:12px;color:var(--ink3);background:var(--bg2);border:1px dashed var(--line2);border-radius:var(--rs);padding:9px 13px}
.gmaster b{color:var(--ink2);font-weight:700}

.hide{display:none!important}
@media(max-width:720px){ .gates{grid-template-columns:1fr} .hero-me{grid-template-columns:1fr} .hero-me .stat{text-align:left}.hero-me .prog,.hero-me .next{margin-left:0} .gtable{font-size:12px} }

/* drop */
#drop{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(8,10,14,.82)}
#drop.show{display:flex}#drop .b{border:2px dashed var(--ac);border-radius:18px;padding:50px 70px;color:var(--ac);font-weight:700}
footer{max-width:1080px;margin:0 auto;padding:20px 22px 40px;color:var(--ink3);font-size:11.5px;text-align:center}
</style>
</head>

let DATA=null, ME=null, sortKey="importance", logLimit=3, guideOpen=false, usingSample=false;
const SCHEMA_V=1;   /* v0.8: 이 대시보드가 아는 board 스키마 '메이저' 버전. DATA.version의 메이저가 크면 경고(마이너 1.1 등은 호환). */
/* v0.8: 상단 배너 — 샘플 데이터 경고(우선) / 미지의 새 스키마 경고 */
function updateBanner(){
  const b=document.getElementById("appBanner"); if(!b)return;
  let msg="", cls="warn";
  if(usingSample){
    msg='⚠ <b>샘플 데이터</b>입니다 (실제 보드 아님). 실데이터를 보려면 같은 폴더에 <b>poffice_board.js</b>/json 을 두거나(더블클릭도 .js면 자동), 파일을 이 창에 <b>드래그</b>하세요.';
  } else if(DATA && DATA.version!=null && Math.floor(parseFloat(DATA.version))>SCHEMA_V){
    cls="info"; msg='⚠ 이 대시보드가 모르는 <b>새 데이터 형식 v'+esc(DATA.version)+'</b> — 최신 대시보드로 여세요(일부 항목이 안 보일 수 있음).';
    console.warn("[poffice] board schema major v"+DATA.version+" > known v"+SCHEMA_V);
  }
  b.hidden=!msg; b.className="appbanner "+cls; b.innerHTML=msg;
}
const memoState={}, checkState={};   // key -> value
const IMP={high:0,mid:1,low:2};
const RANKS=[{n:"게이트마스터",e:"🏆",min:30},{n:"베테랑 요원",e:"🥇",min:15},{n:"숙련 요원",e:"🥈",min:5},{n:"신입 요원",e:"🎖️",min:0}];
const $=s=>document.querySelector(s), esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ck(i,f){return checkState[ME+"|"+i]!==undefined?checkState[ME+"|"+i]:f}
function tsToDate(ts){const m=/^(\d\d)(\d\d)(\d\d)_?(\d\d)?(\d\d)?/.exec(ts||"");if(!m)return null;
  return new Date(2000+ +m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));}
function ageDays(ts){const d=tsToDate(ts);if(!d)return 999;return Math.max(0,(Date.now()-d)/86400000);}
function ageOpacity(a){return a<2?1:a<7?.72:a<30?.46:.26}
function ageLabel(a){a=Math.floor(a);return a<=0?"오늘":a<7?a+"일 전":a<30?Math.floor(a/7)+"주 전":Math.floor(a/30)+"개월 전";}
function dday(due){if(!due)return"";const d=new Date(due+"T00:00:00"),diff=Math.ceil((d-Date.now())/86400000);return diff===0?"D-DAY":diff>0?"D-"+diff:"D+"+(-diff);}
function me(){return DATA.members.find(m=>m.name===ME);}
function doneCount(m){return m.todos.reduce((a,t,i)=>a+(ck(i,t.state)==="done"?1:0),0);}

/* ===== 연동상태 (v0.5) — 최신 세션로그 ts + 데이터 기준시각 + 새로고침 ===== */
/* v0.9 (②): 사내공지 렌더 — DATA.notices[] 중 active(≠false) 최신순 카드. 없으면 빈 문자열(자리 안 만듦). */
function noticesBlock(){
  const ns=(DATA&&DATA.notices||[]).filter(n=>n&&n.active!==false&&(n.title||n.body));
  if(!ns.length)return"";
  ns.sort((a,b)=>String(b.ts||b.date||"").localeCompare(String(a.ts||a.date||"")));
  const lv=v=>v==="urgent"?"urgent":v==="warn"?"warn":"info";           // level → 카드 색
  const tg=v=>v==="urgent"?"긴급 공지":v==="warn"?"주의 공지":"사내공지";
  return `<div class="sec noticesec">`+ns.map(n=>{
    const meta=[(n.date||n.ts),n.by].filter(Boolean).map(esc).join(" · ");
    return `<div class="notice ${lv(n.level)}">
    <div class="nti">📢 ${esc(tg(n.level))}</div>
    ${n.title?`<div class="ntt">${esc(n.title)}</div>`:""}
    ${n.body?`<div class="ntb">${esc(n.body)}</div>`:""}
    ${meta?`<div class="ntd">${meta}</div>`:""}
  </div>`;}).join("")+`</div>`;
}
function allSessions(){return (DATA&&DATA.members||[]).reduce((a,m)=>a.concat(m.sessions||[]),[]);}
function latestLogTs(){const ts=allSessions().map(s=>s.ts).filter(Boolean).sort();return ts.length?ts[ts.length-1]:null;}
/* v0.9: generated_at을 KST로 포맷(브라우저 tz 무관 보장 — UTC ms + 9h 후 getUTC*). */
function fmtGen(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d))return String(iso);
  const k=new Date(d.getTime()+9*3600000),p=n=>String(n).padStart(2,"0");
  return `${String(k.getUTCFullYear()).slice(2)}-${p(k.getUTCMonth()+1)}-${p(k.getUTCDate())} ${p(k.getUTCHours())}:${p(k.getUTCMinutes())} KST`;}
function genAgeDays(iso){const d=new Date(iso);if(isNaN(d))return null;return Math.max(0,(Date.now()-d.getTime())/86400000);}
/* v0.9 (⑤): 칩 본문·신호등 = 보드 생성시각(generated_at) 기준. 최신 세션로그(latestLogTs)는 툴팁으로.
   generated_at 없거나 파싱 실패 시 latestLogTs로 폴백 + "(추정)". "이 보드가 얼마나 오래된 데이터인가"를 답한다. */
function renderConn(){
  const el=$("#connState"); if(!el||!DATA)return;
  const gen=DATA.generated_at, ga=gen?genAgeDays(gen):null, latest=latestLogTs();
  let lvl, mainText, rel;
  if(ga!=null){                                   // 정상: generated_at 기준
    lvl=ga<1?"g":ga<3?"y":"r"; mainText=esc(fmtGen(gen)); rel=ageLabel(ga);
  }else{                                          // 폴백: 구 board / 파싱실패
    const a=latest?ageDays(latest):999;
    lvl=!latest?"r":a<1?"g":a<3?"y":"r";
    mainText=(latest?esc(latest):"—")+' <span class="cest">(추정)</span>'; rel=latest?ageLabel(a):"기록 없음";
  }
  el.className="conn "+lvl;
  el.innerHTML=`<span class="cdot"></span><span class="ct">${mainText}</span><span class="crel">${esc(rel)}</span>${lvl!=="g"?'<span class="crf">⟳ 새로고침</span>':""}`;
  el.title=(ga!=null?`데이터 기준: ${fmtGen(gen)} · `:"데이터 기준시각 없음(구 board) · ")+(latest?`최신 세션로그: ${latest} · `:"")+"클릭하면 새로고침";
}
/* ===== 데이터 로드 (v0.7) =====
   순서: ① poffice_board.js (window.POFFICE_BOARD) — <script> 태그라 file:// 더블클릭에서도 자동 로드
        ② poffice_board.json (fetch) — 로컬서버/일렉트론에서 자동
        ③ SAMPLE (내장) — 파일 둘 다 없을 때 데모
   ※ 같은 폴더에 poffice_board.js 만 있으면 더블클릭으로도 실데이터가 뜬다(코워크 미러가 .js도 생성). */
function injectBoardScript(done){
  const old=document.getElementById("pofcData"); if(old)old.remove();
  try{ delete window.POFFICE_BOARD; }catch(e){ window.POFFICE_BOARD=undefined; }
  const s=document.createElement("script"); s.id="pofcData";
  s.charset="utf-8";                                    // ★핫픽스: file://서 외부 클래식 스크립트가 로케일 기본(latin-1)으로 폴백해 이모지(🔴🟡🟢)가 깨지는 것 방지 — UTF-8 강제
  s.src="./poffice_board.js?t="+Date.now();            // 캐시버스트(서버/일렉트론), file://선 재실행으로 갱신
  s.onload=()=>done(window.POFFICE_BOARD?window.POFFICE_BOARD:null);
  s.onerror=()=>done(null);
  document.head.appendChild(s);
}
function loadBoardData(onData){                          // onData(obj|null)
  injectBoardScript(js=>{
    if(js){ onData(js); return; }
    fetch("poffice_board.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject())
      .then(o=>onData(o)).catch(()=>onData(null));
  });
}
let refreshing=false;
function refreshBoard(){
  if(refreshing)return; refreshing=true;
  const el=$("#connState"); if(el)el.classList.add("loading");
  loadBoardData(o=>{
    if(o){ usingSample=false; DATA=o; if(ME&&DATA.members.some(m=>m.name===ME))render(); else load(o); }
    else if(el){ el.classList.remove("loading"); el.classList.add("r");
      const c=el.querySelector(".crel"); if(c)c.textContent="데이터 파일 없음 · 코워크 미러 확인 또는 드래그"; }
    refreshing=false; if(el)el.classList.remove("loading");
  });
}

/* ===== 워크스페이스 렌더 ===== */
function render(){
  const m=me(); if(!m)return;
  $("#meChip").innerHTML=`<span class="dot"></span><b>${esc(m.name)}</b><span class="r">${esc(m.role||"")}</span>`;
  const done=doneCount(m),total=m.todos.length,pct=total?Math.round(done/total*100):0;
  const rank=RANKS.find(r=>done>=r.min),nextR=RANKS.slice().reverse().find(r=>r.min>done);
  let h=noticesBlock();  /* v0.9 ②: 사내공지 최상단 */
  h+=guideBlock(m);      /* v0.4: 코워크 소통 가이드 — 접기/펴기 */
  h+=`<div class="hero-me">
    <div><div class="big">${esc(m.name)}<span class="r">${esc(m.role||"")}</span></div>
      <div class="rank"><span class="e">${rank.e}</span>${rank.n}</div></div>
    <div class="stat"><div class="n">${done}<small> / ${total} 처리</small></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="next">${nextR?`다음 칭호까지 ${nextR.min-done}건`:"최고 등급"}</div></div></div>`;
  h+=woBlock(m);
  h+=`<div class="sec"><div class="sec-h"><h2>미션 마일스톤</h2><span class="d">골인까지</span><span class="line"></span></div>${missionBlock(m)}</div>`;
  h+=`<div class="sec"><div class="sec-h"><h2>게이트 · 권한</h2><span class="d">🔴 대표검수 · 🟡 팀장판단·보고 · 🟢 자율</span><span class="line"></span></div>${gateBlock(m)}</div>`;
  h+=`<div class="sec"><div class="sec-h"><h2>체크리스트</h2><span class="line"></span></div>${todoBlock(m)}</div>`;
  h+=`<div class="sec"><div class="sec-h"><h2>세션로그</h2><span class="d">최근순 · 오래될수록 흐림</span><span class="line"></span></div>${logBlock(m)}</div>`;
  $("#work").innerHTML=h;
  renderConn();   /* v0.5: 상단 연동상태 갱신 */
  updateBanner(); /* v0.8: 샘플/스키마 경고 배너 */
  bind();
}
function woBlock(m){
  const items=m.todos.map((t,i)=>({t,i})).filter(x=>x.t.wo&&ck(x.i,x.t.state)!=="done");
  if(!items.length)return"";
  return `<div class="wo"><div class="t">Work Order · 대표 지시</div><ul>${items.map(x=>`<li>${esc(x.t.text)}${x.t.mission?`<span class="m mono">${esc(x.t.mission)}</span>`:""}</li>`).join("")}</ul></div>`;
}
function missionBlock(m){
  if(!m.missions||!m.missions.length)return`<div class="gempty">등록된 미션 없음</div>`;
  return m.missions.map(x=>{
    const rm=x.roadmap||[],n=rm.length;
    const pct=Math.round((x.progress!=null?x.progress:(n?rm.filter(s=>s.done).length/n:0))*100);
    const nodes=rm.map((s,i)=>{const left=n>1?(i/(n-1))*100:0;
      return `<div class="node ${s.done?'done':''}" style="left:${left}%" tabindex="0" role="img" aria-label="${esc((i+1)+". "+s.step+(s.done?" (완료)":""))}"><span class="lbl">${s.done?'✓':(i+1)}</span><span class="tip">${esc(s.step)}</span></div>`;}).join("");
    const charInner=(DAY_L&&DAY_R)?`<span class="daywalk" role="img" aria-label="Day">
        <img class="dayframe dayframeL" src="${DAY_L}" alt="" aria-hidden="true">
        <img class="dayframe dayframeR" src="${DAY_R}" alt="" aria-hidden="true">
        <img class="dayframe dayframeC" src="${DAY_C}" alt="" aria-hidden="true"></span>`
      :(SPRITE_URL?`<img src="${SPRITE_URL}" width="26" height="30" alt="Day">`:DAY_SVG);
    const memoKey="mission|"+x.id, mv=memoState[memoKey]!==undefined?memoState[memoKey]:"";
    return `<div class="mission">
      <div class="mh"><div><span class="id">${esc(x.id)}</span><h3>${esc(x.title)}</h3></div><span class="pill ${x.status}">${x.status}</span></div>
      ${x.due?`<div class="dday">${x.status!=="달성"?`<b>${dday(x.due)}</b> · `:""}${esc(x.due)}</div>`:""}
      <div class="track">
        <div class="rail"></div><div class="fill" style="width:${pct}%"></div>${nodes}
        <div class="goal">🚩</div>
        <div class="pctlab" style="left:${pct}%">${pct}%</div>
        <div class="char" style="left:${pct}%">${charInner}</div>
      </div>
      <div class="memo"><label>미션 메모 <span class="req">*</span></label>
        <textarea data-memo="${esc(memoKey)}" placeholder="이 미션 관련 메모 (업로드 시 코워크가 확인)">${esc(mv)}</textarea></div>
    </div>`;
  }).join("");
}
function gateBlock(m){
  const rule={red:"대표(심상윤) 검수·승인 후 진행",yellow:(m.yellow_policy==="report"?"팀장 판단 진행 · 팀원 보고 필수":"팀장 판단 진행"),green:"자율 진행 (기록만)"};
  const col=(k,label,items)=>`<div class="gcol ${k}"><div class="gt"><span class="lamp"></span>${label}<span class="cnt">${items?items.length:0}</span></div>
    <div class="rule">${rule[k]}</div>
    ${items&&items.length?items.map(g=>`<div class="gitem"><div class="l1"><span class="st ${g.state}">${esc(g.state)}</span><span>${esc(g.item)}</span><span class="ts">${esc(g.ts||"")}</span></div>${g.log?`<div class="log">근거 ${esc(g.log)}</div>`:""}</div>`).join(""):`<div class="gempty">—</div>`}</div>`;
  return `<div class="gates">${col("red","보고처리",m.gates.red)}${col("yellow","자체결재",m.gates.yellow)}${col("green","기록만",m.gates.green)}</div>`;
}
function todoBlock(m){
  if(!m.todos.length)return`<div class="gempty">투두 없음</div>`;
  const idx=m.todos.map((t,i)=>i).sort((a,b)=>{
    const ta=m.todos[a],tb=m.todos[b]; if((tb.wo?1:0)-(ta.wo?1:0))return (tb.wo?1:0)-(ta.wo?1:0);
    if(sortKey==="date")return String(tb.date||"").localeCompare(String(ta.date||""));
    return (IMP[ta.importance]??1)-(IMP[tb.importance]??1);});
  const bar=`<div class="sortbar">정렬 <button data-sort="importance" class="${sortKey==="importance"?"on":""}">중요도</button><button data-sort="date" class="${sortKey==="date"?"on":""}">일자</button></div>`;
  return bar+`<div class="todos">`+idx.map(i=>{const t=m.todos[i],st=ck(i,t.state);
    return `<div class="todo ${t.wo?"wo":""} ${st==="done"?"done":""}">
      <button class="cb ${st==="done"?"on":st==="doing"?"doing":""}" data-i="${i}"></button>
      <div><div class="tx">${esc(t.text)}</div><div class="tags">
        ${t.wo?'<span class="tg wo">WO</span>':""}
        ${t.importance?`<span class="tg im ${t.importance}">${t.importance==="high"?"중요":t.importance==="mid"?"보통":"낮음"}</span>`:""}
        ${t.mission?`<span class="tg mid">${esc(t.mission)}</span>`:""}
        ${t.date?`<span class="tg dt">${esc(t.date)}</span>`:""}
      </div></div></div>`;}).join("")+`</div>`;
}
function logBlock(m){
  const logs=(m.sessions||[]).slice().sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  if(!logs.length)return`<div class="gempty">세션로그 없음</div>`;
  const rows=logs.map((s,i)=>{const a=ageDays(s.ts),op=ageOpacity(a);
    const memoKey="session|"+s.ts, mv=memoState[memoKey]!==undefined?memoState[memoKey]:"";
    return `<details class="${i>=logLimit?"hidden":""}" style="opacity:${op}">
      <summary><span class="ts">${esc(s.ts)}</span><span class="sm">${esc(s.summary)}</span><span class="age">${ageLabel(a)}</span><span class="cv">▸</span></summary>
      <div class="body">${s.raw_omitted?`<div class="detail omitted">원문 생략(용량 예산 초과) — 드라이브 원본: ${esc(s.raw_source||s.file||"—")}</div>`:((s.raw||s.detail)?`<div class="detail">${esc(s.raw||s.detail)}</div>`:"")}
        <div class="memo"><label>세션 메모</label><textarea data-memo="${esc(memoKey)}" placeholder="이 세션 관련 메모">${esc(mv)}</textarea></div></div>
    </details>`;}).join("");
  const more=logs.length>logLimit?`<div class="more" id="logMore">오래된 세션로그 ${logs.length-logLimit}개 더 보기 ▾</div>`:"";
  return `<div class="slog">${rows}${more}</div>`;
}

/* ===== 코워크 소통 가이드 렌더 (v0.3) =====
   config override: board.json 의 DATA.guide(또는 DATA.guide_full) 가 있으면 우선, 없으면 베이크된 GUIDE.
   가이드 문구는 오너/베이크된 신뢰 콘텐츠라 의도적으로 HTML 마크업(span/code/b)을 그대로 렌더한다. */
function guideData(){ return (DATA&&(DATA.guide||DATA.guide_full))||GUIDE; }
function guideBlock(m){
  const g=guideData(); const e=g.essentials||{};
  const heads=(e.headers||["이렇게 말하면","언제","무슨 일이"]).map(h=>`<th>${esc(h)}</th>`).join("");
  const rows=(e.rows||[]).map(r=>`<tr><td class="say">${r.say||""}</td><td>${esc(r.when||"")}</td><td>${r.what||""}</td></tr>`).join("");
  // 자세히 카드 (패널이 펼쳐지면 항상 보임) — 쉬운 말, 카드마다 한 줄 안내(lead) 지원
  const cards=(g.more||[]).map(c=>{
    const tag=c.type==="ol"?"ol":"ul";
    const items=(c.items||[]).map(it=>`<li>${it}</li>`).join("");
    return `<div class="gcard ${c.warn?"warn":""}"><h4>${c.icon?esc(c.icon)+" ":""}${esc(c.title)}</h4>${c.lead?`<p class="lead">${esc(c.lead)}</p>`:""}<${tag}>${items}</${tag}></div>`;
  }).join("");
  // 대표 전용 최소 힌트 — me()가 master 일 때만 렌더 (팀원에게는 아예 출력 안 함)
  const masterHint=(m&&m.master&&g.master_hint)?`<div class="gmaster" id="guideMaster">${g.master_hint}</div>`:"";
  const teaser=g.teaser||'"나는 ㅇㅇㅇ이야" · "세션요약" · "마무리"';
  // 전체를 하나의 접이식 패널로. 접혀 있어도 헤더의 teaser(핵심 3마디)는 항상 보임.
  return `<div class="sec guide-sec"><div class="guide">
      <button class="ghead" id="guideHeadBtn" type="button" aria-expanded="${guideOpen?"true":"false"}" aria-controls="guidePanel">
        <span class="gh-ic">💬</span><span class="gh-tt">코워크와 이렇게 대화해요</span>
        <span class="gh-teaser">${teaser}</span>
        <span class="gh-cv"><span id="guideHeadLbl">${guideOpen?"접기":"펼치기"}</span><span class="ar">▾</span></span>
      </button>
      <div class="gpanel" id="guidePanel" ${guideOpen?"":"hidden"}>
        <div class="gnote">${esc(g.note||"")}</div>
        <div class="btitle">이 세 마디면 됩니다 · 항상 이렇게</div>
        <table class="gtable"><thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table>
        ${e.tip?`<div class="gtip">${e.tip}</div>`:""}
        <div class="gdetail">${cards}</div>
        ${masterHint}
      </div>
    </div></div>`;
}

/* ===== 바인딩 ===== */
function bind(){
  document.querySelectorAll(".cb").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,k=ME+"|"+i,cur=ck(i,me().todos[i].state);
    checkState[k]=cur==="done"?"todo":cur==="doing"?"done":"doing"; render();});
  document.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{sortKey=b.dataset.sort;render();});
  document.querySelectorAll("textarea[data-memo]").forEach(t=>{
    t.oninput=()=>{memoState[t.dataset.memo]=t.value; t.classList.add("edited");};});
  const more=$("#logMore"); if(more)more.onclick=()=>{logLimit=999;render();};
  /* v0.4: 코워크 가이드 전체 패널 접기/펴기 (aria-expanded, 키보드 포커스, 기본 접힘) */
  const gb=$("#guideHeadBtn");
  if(gb)gb.onclick=()=>{ guideOpen=!guideOpen;
    gb.setAttribute("aria-expanded",guideOpen?"true":"false");
    $("#guidePanel").hidden=!guideOpen;
    $("#guideHeadLbl").textContent=guideOpen?"접기":"펼치기";};
}

/* ===== export (체크+메모) ===== */
function exportData(){
  const checks={},memos={};
  Object.keys(checkState).forEach(k=>{const[n,i]=k.split("|");if(n===ME)(checks[i]=checkState[k]);});
  Object.keys(memoState).forEach(k=>{if(memoState[k]!=="")memos[k]=memoState[k];});
  const out={member:ME,generated_from:DATA.generated_at||null,check_overrides:checks,memo_overrides:memos,
    note:"Poffice-Skill 이 세션로그·미션 메모/체크에 반영 (타임스탬프는 반영 시 부여)"};
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
  a.download=`poffice_export_${ME}.json`;a.click();
}

/* ===== 로드 ===== */
function load(o){DATA=o; renderGate();
  let saved=null;try{saved=localStorage.getItem("poffice_me")}catch(e){}
  if(saved&&DATA.members.some(m=>m.name===saved))enter(saved);}
function readFile(f){const r=new FileReader();r.onload=()=>{try{usingSample=false;load(JSON.parse(r.result))}catch(e){alert("파싱 실패: "+e.message)}};r.readAsText(f);}

$("#whoList").addEventListener("click",e=>{const b=e.target.closest("button[data-n]");if(b)enter(b.dataset.n);});
$("#switchBtn").onclick=()=>{try{localStorage.removeItem("poffice_me")}catch(e){};ME=null;$("#app").classList.remove("on");$("#gate").classList.remove("hide");};
$("#connState").onclick=refreshBoard;   /* v0.5: 클릭 시 poffice_board.json 재로드 */
$("#exportBtn").onclick=exportData;
$("#gateLoad").onclick=()=>$("#fileInput").click();
$("#fileInput").addEventListener("change",e=>{if(e.target.files[0])readFile(e.target.files[0]);});
const drop=$("#drop");
["dragenter","dragover"].forEach(ev=>window.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("show");}));
window.addEventListener("dragleave",e=>{if(e.clientX===0&&e.clientY===0)drop.classList.remove("show");});
window.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("show");const f=e.dataTransfer.files[0];if(f)readFile(f);});

/* 마더 config 자동 로드 (v0.7): poffice_board.js(script·file:// 자동) → poffice_board.json(fetch) → SAMPLE.
   더블클릭이어도 같은 폴더에 poffice_board.js 있으면 실데이터 로드. 없으면 드래그앤드롭도 가능. */
loadBoardData(o=>{ usingSample=!o; load(o||SAMPLE); });
</script>
