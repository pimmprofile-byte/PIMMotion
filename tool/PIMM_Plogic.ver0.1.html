<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PIMM 플로직 — 이해하기 · 풀어보기</title>
<style>
/* ============================================================
   PIMM Plogic 교육 — 신입→마스터. 데이(Day) 가이드 · 퍼즐식.
   두 모드: 플로직 이해하기(학습) / 플로직 풀어보기(연습→JSON→코워크 채점)
   원칙: 알기 쉽고 실용적. 어려운 개념이 이해되게. 외부 의존 0.
   ============================================================ */
:root{
  --bg:#f6f8f7; --card:#ffffff; --ink:#151a18; --ink2:#5a655f; --ink3:#93a09a;
  --line:#e4e9e6; --line2:#d2dad6;
  --green:#00b877; --green-d:#00925e; --mint:#e7f7f0; --mintline:#bfe9d7;
  --amber:#ef9a3d; --red:#e5675e; --blue:#3f8bd6; --purple:#8a6bd1;
  --r:16px; --rs:11px; --sh:0 2px 10px rgba(20,40,30,.05), 0 12px 30px rgba(20,40,30,.06);
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1512; --card:#141c18; --ink:#e9f0ec; --ink2:#9aa8a1; --ink3:#5f6c66;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --mint:rgba(0,184,119,.1); --mintline:rgba(0,184,119,.28);
  --sh:0 2px 10px rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Segoe UI','Malgun Gothic',sans-serif;
  line-height:1.65;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer} h1,h2,h3,h4,p{margin:0}
.wrap{max-width:960px;margin:0 auto;padding:0 20px}
.mono{font-family:var(--mono);letter-spacing:0}

/* Day 마스코트 */
.day{width:44px;height:52px;flex:none}
.day.sm{width:30px;height:36px}
.bubble{position:relative;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:13px 16px;box-shadow:var(--sh)}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;width:14px;height:14px;background:var(--card);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);transform:rotate(45deg)}
.dayrow{display:flex;gap:14px;align-items:flex-start;margin:18px 0}

/* 헤더 */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.head{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 20px}
.logo{font-weight:800;letter-spacing:-.02em}.logo b{color:var(--green)}
.logo .bc{font-size:11px;color:var(--ink3);font-weight:600;margin-left:6px}
.head .sp{flex:1}
.mode-pills{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mode-pills::-webkit-scrollbar{display:none}
.mode-pills button{font-size:12.5px;font-weight:700;color:var(--ink2);background:transparent;border:1px solid var(--line2);border-radius:999px;padding:7px 14px;flex:none;white-space:nowrap}
.mode-pills button.on{color:#fff;background:var(--green);border-color:var(--green)}
.prog{height:5px;background:var(--line);position:relative}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,var(--green-d),var(--green));width:0;transition:width .4s}

/* 랜딩 */
.landing{text-align:center;padding:56px 20px 40px}
.landing .day{width:96px;height:114px;margin:0 auto 10px}
.landing h1{font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:-.03em}
.landing h1 b{color:var(--green)}
.landing p{color:var(--ink2);margin-top:12px;font-size:clamp(15px,2.4vw,17px)}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:680px;margin:34px auto 0}
.choose button{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:26px 22px;text-align:left;box-shadow:var(--sh);transition:transform .18s,border-color .2s}
.choose button:hover{transform:translateY(-4px);border-color:var(--green)}
.choose .ic{font-size:30px}
.choose h3{font-size:20px;font-weight:800;margin-top:10px}
.choose p{color:var(--ink2);font-size:13.5px;margin-top:6px}
.choose .go{color:var(--green);font-weight:700;font-size:13px;margin-top:12px}
@media(max-width:620px){.choose{grid-template-columns:1fr}}

/* 학습 레이아웃 */
.learn{display:grid;grid-template-columns:220px 1fr;gap:26px;padding:26px 0 80px}
.mnav{position:sticky;top:70px;align-self:start;display:grid;gap:4px}
.mnav button{text-align:left;background:transparent;border:0;border-radius:10px;padding:10px 12px;color:var(--ink2);font-size:13.5px;display:flex;align-items:center;gap:9px}
.mnav button:hover{background:var(--mint)}
.mnav button.on{background:var(--mint);color:var(--green-d);font-weight:700}
.mnav button .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.mnav button.on .n{background:var(--green);color:#fff;border-color:var(--green)}
.mnav button.done .n{background:var(--green-d);color:#fff;border-color:var(--green-d)}
.mnav button.done .n::after{content:"✓"}
.mnav button.done .n span{display:none}

.mod .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:800}
.mod h2{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.03em;margin-top:6px}
.mod .lead{color:var(--ink2);margin-top:10px;font-size:15px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:16px;box-shadow:var(--sh)}
.lesson h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
.lesson h3 .tag{font-size:10px;font-weight:800;color:var(--green-d);background:var(--mint);border:1px solid var(--mintline);border-radius:999px;padding:2px 8px;letter-spacing:.02em}
.lesson p{color:var(--ink2);font-size:14.5px;margin-top:8px}
.lesson .k{color:var(--ink);font-weight:700}
.lesson ul{margin:10px 0 0;padding-left:2px;list-style:none;display:grid;gap:7px}
.lesson ul li{font-size:14px;color:var(--ink2);padding-left:20px;position:relative}
.lesson ul li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.lesson ul li b{color:var(--ink)}
.pipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 2px}
.pipe .st{background:var(--mint);border:1px solid var(--mintline);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--green-d)}
.pipe .ar{color:var(--ink3);font-weight:800}
.note{background:var(--mint);border:1px solid var(--mintline);border-radius:var(--rs);padding:12px 14px;margin-top:14px;font-size:13.5px;color:var(--green-d)}
.note b{color:var(--green-d)}
/* 쉽게 말하면(풀이) / 실제 사례 콜아웃 */
.plain{background:color-mix(in srgb,var(--amber) 12%,var(--card));border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:var(--rs);padding:11px 14px;margin-top:12px;font-size:14px;color:var(--ink)}
.plain .lb,.ex .lb{display:block;font-size:10.5px;font-weight:800;letter-spacing:.05em;margin-bottom:4px;text-transform:uppercase}
.plain .lb{color:var(--amber)} .plain b{color:var(--ink);font-weight:700}
.ex{background:color-mix(in srgb,var(--blue) 10%,var(--card));border:1px solid color-mix(in srgb,var(--blue) 34%,transparent);border-radius:var(--rs);padding:11px 14px;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.ex .lb{color:var(--blue)} .ex b{color:var(--ink);font-weight:700}

/* 작업체계(4 Forge) 페이지 */
.sys{padding:26px 0 90px}
.sys-hero{max-width:760px;margin-bottom:6px}
.sys-hero .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);font-weight:800}
.sys-hero h2{font-size:clamp(24px,4vw,32px);font-weight:800;letter-spacing:-.03em;margin-top:6px}
.sys-hero .lead{color:var(--ink2);margin-top:10px;font-size:15px}
.forge-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media(max-width:720px){.forge-grid{grid-template-columns:1fr}}
.forge{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border-top:3px solid var(--fc)}
.forge.f-green{--fc:var(--green)}.forge.f-amber{--fc:var(--amber)}.forge.f-blue{--fc:var(--blue)}.forge.f-purple{--fc:var(--purple)}
.fh{display:flex;gap:12px;align-items:center}
.fi{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;background:color-mix(in srgb,var(--fc) 14%,transparent);border:1px solid color-mix(in srgb,var(--fc) 30%,transparent);flex:none}
.fk{font-size:18px;font-weight:800}.fk .fen{font-size:12px;color:var(--fc);font-weight:700;margin-left:5px;letter-spacing:.02em}
.ftag{font-size:11.5px;color:var(--ink3);font-weight:700;margin-top:2px}
.fone{color:var(--ink);font-size:14.5px;font-weight:700;margin-top:13px;letter-spacing:-.01em}
.fdesc{color:var(--ink2);font-size:13px;margin-top:8px;line-height:1.62}
.flist{margin:11px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.flist li{font-size:13.5px;color:var(--ink2);padding-left:18px;position:relative}
.flist li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--fc)}
.fuse{margin-top:13px;background:color-mix(in srgb,var(--fc) 8%,transparent);border:1px dashed color-mix(in srgb,var(--fc) 34%,transparent);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--ink2);line-height:1.55}
.fuse .lb{display:block;font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--fc);margin-bottom:3px;text-transform:uppercase}
.fuse b{color:var(--ink);font-weight:700}
.frole{margin-top:13px;font-size:12px;font-weight:800;color:var(--fc);background:color-mix(in srgb,var(--fc) 12%,transparent);border:1px solid color-mix(in srgb,var(--fc) 26%,transparent);border-radius:999px;padding:5px 12px;display:inline-block}
.axis{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:16px;box-shadow:var(--sh)}
.axis h4{font-size:15px;font-weight:800}.axis p{color:var(--ink2);font-size:13.5px;margin-top:6px}
.axis .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.axis .ac{border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink2)}
.axis .ac b{color:var(--ink)} .axis .ac .h{font-weight:800;color:var(--ink);font-size:13px;margin-bottom:3px}
@media(max-width:560px){.axis .grid2{grid-template-columns:1fr}}

/* 심화(딥다이브) */
.mnav button.lock{opacity:.55}
.mnav button.lock .n{border-style:dashed}
.deep-sub{font-size:14px;color:var(--ink3);font-weight:600;margin-left:6px}
.dwrap{overflow-x:auto;margin-top:12px}
.dtable{width:100%;border-collapse:collapse;font-size:13px;min-width:440px}
.dtable th,.dtable td{border:1px solid var(--line2);padding:8px 11px;text-align:left;vertical-align:top}
.dtable th{background:var(--mint);color:var(--green-d);font-weight:800;font-size:12px;white-space:nowrap}
.dtable td b{color:var(--ink)}
.dtable tr .pk{color:var(--red);font-weight:800}
.lesson h4{font-size:15px;font-weight:800;margin-top:2px}
.chk-static{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.chk-static li{font-size:13.5px;color:var(--ink2);padding-left:26px;position:relative}
.chk-static li::before{content:"✔";position:absolute;left:2px;top:0;color:var(--green);font-weight:800}
.lock-card{text-align:center;padding:34px 20px}
.lock-card .big{font-size:34px}
.lock-card h3{font-size:18px;font-weight:800;margin-top:8px}
.lock-card p{color:var(--ink2);font-size:14px;margin-top:8px;max-width:440px;margin-left:auto;margin-right:auto}
@media(max-width:560px){.dtable{min-width:0;font-size:11.5px}.dtable th,.dtable td{padding:6px 7px}.deep-sub{display:block;margin-left:0;margin-top:2px}}

/* 아티잔 6도메인 · 3단계 */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend span{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.legend i{font-style:normal;width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.lvl{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);border-top:3px solid var(--green)}
.lvl.l1{border-top-color:var(--line2)}.lvl.l2{border-top-color:var(--green)}.lvl.l3{border-top-color:var(--green-d)}
.lvl.m1{border-top-color:var(--green)}.lvl.m2{border-top-color:var(--blue)}.lvl.m3{border-top-color:var(--amber)}
.lvl.m1 .step{color:var(--green)}.lvl.m2 .step{color:var(--blue)}.lvl.m3 .step{color:var(--amber)}
.lvl .step{font-size:11px;font-weight:800;color:var(--green);letter-spacing:.06em}
.lvl h4{font-size:16px;font-weight:800;margin-top:4px}.lvl h4 small{font-size:12px;color:var(--ink3);font-weight:600;margin-left:5px}
.lvl p{color:var(--ink2);font-size:13px;margin-top:8px;line-height:1.6}
.sec-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:28px}
.ladder{display:grid;gap:10px;margin-top:14px}
.rung{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:14px;padding:13px 16px;box-shadow:var(--sh)}
.rung.expert{border-left-color:var(--green)}
.rung .rn{width:30px;height:30px;border-radius:8px;background:var(--line);color:var(--ink2);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
.rung.expert .rn{background:var(--green);color:#fff}
.rung .rc{flex:1;min-width:0}
.rung .rt{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rung .rt small{font-size:12px;color:var(--ink3);font-weight:600}
.rung .gr{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.rung .gr.xp{color:var(--green-d);border-color:var(--mintline);background:var(--mint)}
.rung .rd{color:var(--ink2);font-size:13px;margin-top:5px;line-height:1.6}
@media(max-width:640px){.lvls{grid-template-columns:1fr}}

/* 인라인 퀴즈(이해하기 자가확인) */
.check{border:1px dashed var(--line2);border-radius:var(--r);padding:18px;margin-top:18px;background:var(--card)}
.check .q{font-weight:700;font-size:14.5px;display:flex;gap:8px;align-items:flex-start}
.check .q .b{color:var(--amber)}
.opts{display:grid;gap:8px;margin-top:12px}
.opts button{text-align:left;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;font-size:14px;transition:.15s}
.opts button:hover{border-color:var(--green)}
.opts button.correct{background:var(--mint);border-color:var(--green);color:var(--green-d);font-weight:700}
.opts button.wrong{background:color-mix(in srgb,var(--red) 12%,var(--bg));border-color:var(--red)}
.fb{margin-top:10px;font-size:13px;display:none}.fb.show{display:block}
.fb.ok{color:var(--green-d)}.fb.no{color:var(--red)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.matchgrid .cell{background:var(--bg);border:1px solid var(--line2);border-radius:9px;padding:9px 11px;font-size:13px}

.modfoot{display:flex;justify-content:space-between;align-items:center;margin-top:24px}
.btn{background:var(--green);color:#fff;border:0;border-radius:999px;padding:11px 22px;font-weight:700;font-size:14px}
.btn:hover{background:var(--green-d)} .btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line2)}
.badge-pop{display:inline-flex;align-items:center;gap:7px;background:var(--mint);border:1px solid var(--mintline);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--green-d)}

/* 풀어보기 */
.solve{padding:26px 0 90px}
.solve-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.solve-head h2{font-size:clamp(22px,4vw,30px);font-weight:800}
.solve-head .sp{flex:1}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-top:14px;box-shadow:var(--sh)}
.qcard .meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--ink3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.qcard .meta .lv{padding:2px 8px;border-radius:999px;border:1px solid var(--line2)}
.qcard .meta .lv.recall{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 40%,transparent)}
.qcard .meta .lv.create{color:var(--purple);border-color:color-mix(in srgb,var(--purple) 40%,transparent)}
.qcard .qt{font-size:16px;font-weight:700;margin-top:8px}
.qcard .hint{font-size:13px;color:var(--ink2);margin-top:6px}
.qcard textarea{width:100%;margin-top:12px;background:var(--bg);border:1px solid var(--line2);border-radius:var(--rs);color:var(--ink);font:inherit;font-size:14px;padding:12px;resize:vertical;min-height:90px}
.qcard textarea:focus{outline:none;border-color:var(--green)}
.qcard .saved{font-size:12px;color:var(--green-d);margin-top:6px;display:none}.qcard .saved.show{display:inline-block}
.export-bar{position:sticky;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:14px 0;margin-top:20px}
.export-bar .in{max-width:960px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:12px}
.export-bar .cnt{font-size:13px;color:var(--ink2)}
.namein{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;color:var(--ink)}

footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--ink3);font-size:12px;text-align:center}
.hide{display:none!important}
@media(max-width:720px){.learn{grid-template-columns:1fr}.mnav{position:static;grid-auto-flow:column;overflow-x:auto;padding-bottom:6px;min-width:0;max-width:100%}.mnav button{white-space:nowrap}.mod{min-width:0}}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="logo"><b>PIMM</b> 플로직<span class="bc">핌허브 · Plogic</span></div>
    <div class="sp"></div>
    <div class="mode-pills" id="modePills" style="display:none">
      <button data-mode="learn" class="on">이해하기</button>
      <button data-mode="solve">풀어보기</button>
      <button data-mode="deep">심화과정</button>
      <button data-mode="artisan">아티잔</button>
      <button data-mode="system">작업체계</button>
      <button data-mode="home" style="border:0;color:var(--ink3)">↺</button>
    </div>
  </div>
  <div class="prog"><i id="progBar"></i></div>
</header>

    plain:"오픈했다고 끝이 아니야. <b>다 만든 결과물로 '홍보영상 찍고, 마케팅 소재 뽑고, 다음 계약을 따내는'</b> 뒷단 작업이 Max야. 여기서 잘해야 한 프로젝트가 '한 번 벌고 끝'이 아니라 회사의 자산이 돼.",
    ex:"관계가 좋았던 현장은 Max가 풍성(스케치필름·재계약까지) / 반대로 공기 지연으로 잔금이 밀리고 촬영이 무산되면 <b>아무리 잘 지었어도 Max가 통째로 날아가</b>. 그래서 Max는 '품질'보다 '관계'가 좌우해."},
   {h:"Tier마다 깊이가 다르다",tag:"실용",p:"같은 단계라도 T1/T2/T3에 따라 산출물의 밀도가 달라. 각 단계엔 Tier·트랙별 <span class='k'>제작가이드</span>가 있어."}

 {id:3,eyebrow:"MODULE 3",title:"크래프트 이론 — '겪게' 만드는 기술",lead:"예쁜 세트를 넘어 '몰입'을 설계하는 범용 마스터로직들.",
  day:"세트만 예쁘면 전시야. 방문객이 '겪게' 만들려면 기술이 필요해. 칙센트미하이·노먼·카네먼·디즈니에서 빌려와 핌식으로 다듬은 범용 프레임워크들을 소개할게.",
  lessons:[
   {h:"서사구조 — 8-Cell 감정역학",tag:"이론",p:"3막 구조를 시퀀스 타임라인으로 해체·재조합한 8칸. 방문객의 <span class='k'>감정 곡선</span>을 의도적으로 설계해.",list:["Cell 1~2 도입·사건 (첫인상=세계관 선언) / 3~4 전환·고조 / <b>5~6 충격·폭발 = Peak</b>(하드웨어 총동원, Sensory Override)","<b>7 쉼(Pause)</b> — 정보 비대칭·성찰로 낙차를 벌림 / <b>8 결말 = End</b>(변화된 페르소나 확인)"],
    plain:"영화의 '기승전결'을 <b>8개 장면 칸으로 쪼갠 감정 설계표</b>라고 보면 돼. 어디서 놀라게 하고(5~6=최고조), 어디서 숨 돌리게 하고(7=쉼), 어떻게 끝낼지(8)를 <b>미리 칸마다 정해두는</b> 거야. 감정을 운에 맡기지 않는 게 핵심.",
    ex:"'Sensory Override(감각 폭주)'? → 5~6칸에서 조명·사운드·진동·특효를 한꺼번에 터뜨려 <b>정신 못 차리게 압도하는</b> 순간. 그 직후 7칸에서 갑자기 조용해지면 낙차 때문에 더 강렬하게 기억돼."},
   {h:"환경적 스토리텔링 4계층",tag:"이론",p:"디즈니 이매지니어링식 4겹. 한 계층만 빠져도 '세트', 전부 완성되면 '세계'.",list:["L1 하드스케이프(골조·마감)에서 압도 · L2 테크/인프라(조명·음향·특효) · L3 프롭(기능/데코 엄격 분리)에서 쾌감 · L4 오버레이(그래픽·텍스트, 최소운용·임팩트극대화)"]},
   {h:"플로우 & 어포던스 (공식으로 기억)",tag:"이론",list:["<b>Flow = Density × (1/Friction)</b> — 상호작용 밀도가 높으면 인지비용(마찰)을 낮춰라. 둘 다 높으면 몰입이 붕괴돼","<b>어포던스 = Mechanical Instinct = Physical Volume × Auditory Feedback</b> — 형태로 조작법이 읽히고, 피드백은 0.1초 이내. 물리 조작기 > 평면 터치"],
    plain:"<b>Flow</b> — 할 게 많으면(밀도↑) 헷갈리게 만들지 마라(마찰↓). '바쁜데 명확한' 상태가 몰입이야. 바쁜데 헷갈리기까지 하면 사람은 그냥 포기해.<br><b>어포던스</b> — <b>설명 안 붙여도 '아, 이건 당기는 거구나' 하고 손이 먼저 아는 것.</b> 커 보이고 소리·불빛으로 즉각 반응하면 사람은 자연히 그걸 조작해.",
    ex:"레버는 손잡이가 크고 '철컥' 소리가 나니 아무도 설명 안 해도 당김(좋은 어포던스). 반대로 벽에 붙은 밋밋한 터치패드는 눌러야 할지 몰라 다들 그냥 지나침(나쁜 어포던스) → 물리 조작기로 바꿔라."},
   {h:"로그라인 · 피크엔드 · 엔딩 3단계",tag:"이론",list:["<b>P-Logline = Concept Clash × Clear Mission</b> — 모든 테마는 한 문장으로. 비트제안서 첫 장에 명기","<b>피크-엔드 법칙</b>(카네먼) — 사람은 Peak(5~6)과 End(8)로 전체를 기억. 사이에 7(쉼)을 넣어 낙차 극대화","<b>엔딩 3단계</b> — 목적성 완결 → 감각적 해방(전 하드웨어 동시폭발) → 큐레이팅된 쿨다운(전환음악으로 현실복귀). 쿨다운 없이 즉시 퇴장하면 고양감이 '혼란'이 됨"],
    plain:"<b>피크-엔드</b>: 사람은 체험 전체를 기억하는 게 아니라 <b>'가장 짜릿했던 순간(Peak)'과 '마지막 순간(End)' 두 컷</b>으로 기억해. 그래서 이 둘에 자원을 몰아줘야 '재밌었다'는 후기가 나와.<br><b>엔딩 3단계</b>: 다 풀고(목적 완결) → 빵 터뜨리고(감각 해방) → <b>잔잔하게 식혀 내보낸다(쿨다운).</b> 식히는 단계를 빼먹으면 흥분이 '어리둥절'로 변해.",
    ex:"방탈출 마지막 — 자물쇠를 열자(완결) 전 조명·사운드가 폭발하며 문이 열리고(해방), 짧은 엔딩 음악과 함께 천천히 퇴장(쿨다운). 딱 문만 '탁' 열고 끝내면 벅찬 감정이 갈 곳을 잃어."},
   {h:"게임퍼즐 — MDA · 장면연출",tag:"이론",list:["<b>MDA</b> — Mechanics(장치)→Dynamics(작동)→Aesthetics(감정). 힌트는 3레이어링","<b>장면연출</b> — 미장센, <b>Synchresis</b>(소리·영상 0.1초 싱크), Gateway Effect, Pacing. 톤은 밝고 압도적으로(무의미한 어둠·공포 지양)"]}
  ],
  check:{type:"mc",q:"'밀도가 높으면 마찰(인지비용)을 낮춰라'를 담은 공식은?",opts:["Concept Clash × Clear Mission","Density × (1/Friction)","Physical Volume × Auditory Feedback","Mechanics→Dynamics→Aesthetics"],ans:1,fb:"맞아! Flow = Density × (1/Friction). 밀도·마찰이 동시에 높으면 몰입이 무너져."}
 },
 {id:4,eyebrow:"MODULE 4",title:"실전 — 헌법·트랙·제안서",lead:"반드시 지켜야 할 기술 표준, 트랙별 적용 차이, 그리고 파는 기술.",
  day:"이제 실전이야. 아무리 좋은 아이디어도 '안 돌면' 끝. 먼저 절대 지켜야 할 기술적 헌법부터, 그다음 트랙별 차이와 제안서까지.",
  lessons:[
   {h:"기술적 헌법 — '안정성이 창의성보다 우선'",tag:"표준",p:"결벽에 가까운 가동률이 원칙. 통제 불가능한 외부변수에 의존하는 기획은 폐기해.",list:["<b>센서 블랙리스트</b> — 적외선·무게·진동·조도 (오반응·데이터 튐)","<b>센서 화이트리스트</b> — 마그네틱·RFID·물리버튼/리미트스위치","<b>'유선이 곧 진리'</b> — 주력 Arduino Mega 2560, 1:1 USB 유선직결(무선 금지)","<b>500-500-200</b> — 모든 장치는 가로500×세로500×깊이200mm 이상 점검구를 확보해야 설계 승인","브릿지 SW: <b>PIMM Player</b>(센서신호→변수), <b>PIMMotion</b>(스위치·변수 직관 도구)"],
    plain:"아무리 기발한 장치도 <b>손님 앞에서 '가끔 안 되면' 그날 장사는 망함.</b> 그래서 핌은 '멋지지만 불안한 방법'보다 <b>'조금 투박해도 100% 되는 방법'</b>을 항상 우선해. 이게 '안정성 > 창의성'의 뜻이야.",
    ex:"적외선 센서는 햇빛·먼지·손 위치에 따라 헛트리거가 나 → <b>가까이 대면 딱 붙는 마그네틱 센서</b>로 교체. 무선 통신은 언젠가 끊기니 → <b>USB 유선으로 직결.</b> '점검구 500-500-200'은 고장 났을 때 손이 들어가 고칠 공간을 미리 비워두라는 규칙이야."},
   {h:"트랙별 적용 차이",tag:"트랙",p:"크게 <b>PIMMersive(상설)</b>와 <b>PIMMup(팝업)</b> 두 갈래로 강조점이 달라.",list:["<b>PIMMscape (방탈출 · PIMMersive)</b> — 단서·퍼즐·서사 통과. MDA·어포던스가 핵심. 렌더 산출물은 <b>디벨롭기획안</b>(발주리스트 별도)","<b>PIMMex (체험형 상설매장 · PIMMersive)</b> — 인터랙션보다 <b>연출체험</b>(빛·소리·타이밍·공간)이 생명. 예: 공포체험관","<b>PIMMup (팝업·단기)</b> — 집객·화제성 목표. 렌더 산출물은 <b>최종시안</b>(발주·치수·입면도·공정표 포함, 공기제약). 세부: B2C=PIMMercial / B2G=PIMMvention"]},
   {h:"소형테마 특화로직 (핌스케이프 노트단계)",tag:"실전",p:"6평을 2~3배로 쓰는 핌만의 기술.",list:["<b>공간 가변성</b>(천장하강·가구매립) · <b>연출적 분리</b>(디지털존 vs 아날로그존 감각대비)","<b>하이브리드 에셋관리</b>(동일 HW 위 SW만 교체) · <b>심리적 타격감</b>(강제실패·전원코드 뽑기)"]},
   {h:"제안서 마스터로직 — 파는 기술",tag:"실전",p:"두 직교 축: <span class='k'>Tier(분량·증명깊이) × 표현타입</span>.",list:["<b>표현 4타입</b> — A 비주얼(톤앤매너·연출) / B 인터랙션(퍼즐·기믹) / C 비즈니스(매출·실현가능성, 가장 포멀) / D 공간(한 슬라이드 한 렌더)","<b>CI 표준</b> — 다크그레이 #262626 + #00FF99, Pretendard, .page 1920×1080, 격식체(~습니다)","<b>그리드 규율 최우선</b> — 텍스트 넘침·이미지 가림 0. 5단계 QC로 앞에서부터 누적 확정"]}
  ],
  check:{type:"mc",q:"기술적 헌법에서 신뢰(화이트리스트)하는 센서는?",opts:["적외선","진동","마그네틱·RFID","조도"],ans:2,fb:"맞아! 마그네틱·RFID·물리버튼이 화이트리스트. 적외선·무게·진동·조도는 블랙리스트야."}
 },
 {id:5,eyebrow:"MODULE 5",title:"마스터 — 판단하는 사람",lead:"만드는 사람에서 판단하는 사람으로. 경영·판단로직과 아티잔 마인드셋.",
  day:"마지막 관문. 마스터는 '잘 만드는 사람'을 넘어 '옳게 판단하는 사람'이야.",
  lessons:[
   {h:"채산성·견적 — 이 프로젝트 남는가",tag:"판단",p:"견적 = <span class='k'>콘크리트(외주비+공정비) + 동액의 진행비.</span> 그래서 <span class='k'>총견적 ≈ 콘크리트 × 2.</span>",list:["<b>콘크리트는 최소화</b> 대상(원가율↑·통제불능) / <b>진행비는 마진의 원천</b>","협상은 항상 진행비에서 빼줌(콘크리트는 안 건드림). 커트라인은 마진율이 아니라 <b>절대 마진액</b>","마진 깎는 3조건: 클라이언트 밸류↑ / 활용도↑ / 급함"],
    plain:"<b>콘크리트</b> = 남한테 그대로 나가는 실비(외주·자재). 못 깎고, 남는 것도 없음. <b>진행비</b> = 우리가 일해서 붙이는 값 = <b>마진의 원천.</b> 견적은 대충 '실비 × 2'로 잡아. 그래서 콘크리트는 최대한 줄이고, 진행비를 지키는 게 남는 장사야.",
    ex:"클라이언트가 '깎아달라' 하면 → <b>진행비에서만 조금 양보</b>하고 콘크리트(실비)는 절대 안 건드려. 실비를 깎으면 그 손해가 고스란히 내 주머니에서 나가거든. 그리고 볼 건 '마진율 %'가 아니라 '<b>실제로 손에 쥐는 금액</b>'이야."},

        <li><b>④ 실전 · 기록</b> — 피모션·파트웍으로 만들고 포피스로 기록·피드백. OJT로 손에 붙인다</li>
      </ul>
      <div class="plain"><span class="lb">쉽게 말하면</span>이론만 알면 '눈'만 높아지고, 만들기만 하면 '손'만 바빠져. <b>배움(이해·심화) ↔ 실전(풀어보기·현장) ↔ 기록(포피스)</b>을 계속 돌려야 도메인이 진짜 마스터로 자라.</div>
    </div>

    <div class="modfoot"><button class="btn ghost" data-mode="home">← 처음으로</button><button class="btn" data-mode="learn">이해하기부터 시작 →</button></div>
  </div>`;
  $("#app").querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
}

/* ===== 심화 (딥다이브) — 크래프트 이론을 이론별로 깊게 ===== */
let curTheory=0;
const DEEP_CRAFT=[
 {id:"narrative",name:"서사구조",sub:"8-Cell · 4계층 · 피크엔드",ready:true,
  body:`
<div class="lesson"><h3>서사구조란 무엇인가 <span class="tag">개요</span></h3>
<p>세트가 아무리 멋져도 방문객의 <b>감정이 어디서 오르고 내려갈지</b>를 정하지 않으면 그건 '전시'야. 서사구조는 <span class="k">감정을 운에 맡기지 않고 설계</span>하는 기술 묶음이야.</p>
<p>핌은 이걸 세 겹으로 다뤄 — ① 감정의 뼈대 <b>8-Cell</b> · ② 공간이 스스로 이야기하게 하는 <b>환경적 스토리텔링 4계층</b> · ③ 사람의 기억을 지배하는 <b>피크-엔드 · 엔딩 3단계</b>.</p>
<div class="plain"><span class="lb">쉽게 말하면</span>각본가가 '여기서 울리고 여기서 웃긴다'를 미리 짜듯, <b>방문객의 감정 곡선을 칸칸이 미리 설계</b>하는 거야. 이게 되면 '예뻤다'가 아니라 '겪었다'가 나와.</div></div>

<div class="lesson"><h3>① 8-Cell 감정역학 <span class="tag">핵심 뼈대</span></h3>
<p>3막 구조(도입·전개·결말)를 <b>8개의 감정 칸</b>으로 잘게 해체·재조합한 타임라인이야. 각 칸이 방문객에게 줄 감정을 못 박아둬.</p>
<div class="dwrap"><table class="dtable">
<tr><th>칸</th><th>국면</th><th>이 칸이 하는 일</th><th>핌의 실행</th></tr>
<tr><td><b>1~2</b></td><td>도입·사건</td><td>첫인상 = 세계관 선언</td><td>환경적 스토리텔링으로 '여기가 어디인지'를 말 없이 각인</td></tr>
<tr><td><b>3~4</b></td><td>전환·고조</td><td>긴장을 계단식으로 레벨링</td><td>난이도·정보를 조금씩 올려 몰입 유지</td></tr>
<tr><td><b class="pk">5~6</b></td><td>충격·폭발 = <b class="pk">Peak</b></td><td>감정 최고조</td><td>하드웨어 총동원(조명·사운드·진동·특효) = Sensory Override</td></tr>
<tr><td><b>7</b></td><td>쉼(Pause)</td><td>성찰·정보 비대칭</td><td>갑자기 조용히 — Peak와의 낙차를 벌림</td></tr>
<tr><td><b>8</b></td><td>결말 = <b>End</b></td><td>변화된 '나'를 확인</td><td>피크-엔드의 마지막 실행점(아래 ③)</td></tr>
</table></div>
<ul><li><b>비균등 배분</b> — 칸마다 시간을 다르게. 5~6에 자원을 몰아준다</li><li><b>인과 체인</b> — 앞 칸이 뒤 칸의 원인이 되게 (우연 금지)</li><li><b>피드백 루프</b> — 방문객 행동에 즉각 반응이 돌아오게</li></ul>
<div class="plain"><span class="lb">쉽게 말하면</span>'놀라게 할 곳(5~6)'과 '숨 돌릴 곳(7)'과 '끝맺을 곳(8)'을 <b>미리 칸에 배정</b>하는 표야. 감정을 즉흥에 맡기지 않는 게 핵심.</div></div>

<div class="lesson"><h3>② 환경적 스토리텔링 4계층 <span class="tag">공간이 말하게</span></h3>
<p>디즈니 이매지니어링식 4겹. 대사 한 줄 없이도 <b>공간 스스로 이야기를 하게</b> 쌓는 층이야.</p>
<ul><li><b>L1 하드스케이프</b> — 골조·마감. 여기서 방문객을 압도</li><li><b>L2 테크·인프라</b> — 조명·음향·특수효과</li><li><b>L3 프롭</b> — 소품(기능용/데코용을 엄격히 분리). 여기서 만지는 쾌감</li><li><b>L4 오버레이</b> — 그래픽·텍스트·캐릭터. 최소로 쓰되 임팩트는 최대로</li></ul>
<div class="ex"><span class="lb">실제 사례</span>같은 '버려진 연구소'라도 — 콘크리트 질감(L1)이 압도하고, 깜빡이는 경광등(L2)이 긴장을 주고, 실제로 열리는 서랍 속 문서(L3)에서 쾌감이 오고, 벽의 경고 스티커(L4)가 마지막 설정을 박아. <b>한 계층이라도 빠지면 '세트', 다 채우면 '세계'</b>가 돼.</div></div>

<div class="lesson"><h3>③ 피크-엔드 법칙 &amp; 엔딩 3단계 <span class="tag">기억의 설계</span></h3>
<p><b>피크-엔드 법칙</b>(카네먼) — 사람은 체험 전체를 기억하지 않고 <span class="k">'가장 짜릿했던 순간(Peak=5~6)'과 '마지막 순간(End=8)'</span> 두 컷으로 기억해. 그래서 이 둘에 자원을 몰아줘야 좋은 후기가 나와.</p>
<p>그 마지막(End)을 어떻게 닫느냐가 <b>엔딩 3단계</b>야:</p>
<div class="pipe"><span class="st">목적성 완결</span><span class="ar">→</span><span class="st">감각적 해방</span><span class="ar">→</span><span class="st">큐레이팅된 쿨다운</span></div>
<ul><li><b>목적성 완결</b> — 미션을 풀어 '해냈다'를 확정</li><li><b>감각적 해방</b> — 전 하드웨어 동시 폭발로 카타르시스</li><li><b>큐레이팅된 쿨다운</b> — 잔잔한 전환 음악으로 현실 복귀시킴</li></ul>
<div class="plain"><span class="lb">쉽게 말하면</span>다 풀고(완결) → 빵 터뜨리고(해방) → <b>천천히 식혀 내보낸다(쿨다운).</b> 식히는 단계를 빼먹고 문만 '탁' 열어 내보내면, 벅찬 감정이 갈 곳을 잃고 '어리둥절'로 변해.</div></div>

<div class="lesson"><h3>스스로 점검 <span class="tag">체크리스트</span></h3>
<ul class="chk-static"><li>내 테마의 Peak는 몇 번째 칸이고, 어떤 하드웨어를 몰아줬나?</li><li>Peak 직후에 '쉼(7칸)'을 넣어 낙차를 만들었나?</li><li>환경적 스토리텔링 4계층이 다 있나? (하나라도 빠지면 '세트')</li><li>엔딩에 '쿨다운'이 있나, 아니면 문만 열고 끝내나?</li></ul>
<div class="note">이 이론으로 <b>직접 만들어보는 창작 문제</b>는 <b>「풀어보기」</b> 모드에 있어. 여기서 원리를 익히고, 거기서 손으로 써보면 돼!</div></div>
`},
 {id:"space",name:"공간구성",sub:"Z-Axis · 감각 레이어링 · 500-500-200",ready:false},
 {id:"puzzle",name:"게임퍼즐 · 어포던스",sub:"MDA · Flow · Mechanical Instinct",ready:false},
 {id:"scene",name:"장면연출",sub:"미장센 · Synchresis · Pacing",ready:false},
 {id:"genre",name:"장르컨셉",sub:"컨셉충돌 · P-SF/Horror/Brand",ready:false},
 {id:"ops",name:"운영설계",sub:"안전 · 회전율 · 유지보수",ready:false}
];
function renderDeep(){
  const nav=DEEP_CRAFT.map((t,i)=>`<button data-t="${i}" class="${i===curTheory?'on':''} ${t.ready?'':'lock'}"><span class="n"><span>${t.ready?'✦':'🔒'}</span></span>${t.name}</button>`).join("");
  const t=DEEP_CRAFT[curTheory];
  const article=t.ready?t.body:`<div class="lesson lock-card"><div class="big">🔒</div><h3>${t.name} — 심화 준비 중</h3><p>이 이론의 심화 교재는 <b>플로직 원문(그린필드) 정독 후</b> 공개돼요. 핌 고유의 특화 파트가 섞여 있어, <b>무왜곡</b>을 위해 원문을 대조한 뒤 채웁니다. 지금은 서사구조부터 깊게 파보세요!</p><button class="btn" id="toNarr">서사구조부터 보기 →</button></div>`;
  $("#app").innerHTML=`<div class="wrap learn">
    <nav class="mnav">${nav}</nav>
    <section class="mod">
      <div class="eyebrow">DEEP DIVE · 크래프트 이론</div>
      <h2>${t.name}${t.sub?`<span class="deep-sub">${t.sub}</span>`:''}</h2>
      <div class="dayrow">${daySVG("sm")}<div class="bubble">${t.ready?"개괄에서 한 발 더! 이 이론이 '왜' 그렇게 작동하는지, 어떻게 손으로 쓰는지까지 파보자.":"이건 아직 원문 대조 전이라 잠가뒀어. 지어내지 않는 게 우리 원칙이니까!"}</div></div>
      ${article}
    </section></div>`;
  $("#app").querySelectorAll(".mnav button").forEach(b=>b.onclick=()=>{curTheory=+b.dataset.t;render();window.scrollTo(0,0)});
  const tn=$("#toNarr");if(tn)tn.onclick=()=>{curTheory=0;render();window.scrollTo(0,0)};
}

/* ===== 이해하기 ===== */
function renderLearn(){
  const nav=MODULES.map(m=>`<button data-m="${m.id}" class="${m.id===curMod?'on':''} ${store.done[m.id]?'done':''}"><span class="n"><span>${m.id}</span></span>${m.title}</button>`).join("");
  const m=MODULES[curMod];
  const lessons=m.lessons.map(l=>{
    let body=l.p?`<p>${l.p}</p>`:"";
    if(l.pipeline)body+=`<div class="pipe">${l.pipeline.map((s,i)=>`<span class="st">${s}</span>${i<l.pipeline.length-1?'<span class="ar">→</span>':''}`).join("")}</div>`;
    if(l.plain)body+=`<div class="plain"><span class="lb">쉽게 말하면</span>${l.plain}</div>`;
    if(l.list)body+=`<ul>${l.list.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    if(l.ex)body+=`<div class="ex"><span class="lb">실제 사례</span>${l.ex}</div>`;
    return `<div class="lesson"><h3>${l.h}${l.tag?`<span class="tag">${l.tag}</span>`:''}</h3>${body}</div>`;
  }).join("");
  const done=store.done[m.id];
  $("#app").innerHTML=`<div class="wrap learn">
    <nav class="mnav">${nav}</nav>
    <section class="mod">
      <div class="eyebrow">${m.eyebrow}</div><h2>${m.title}</h2><p class="lead">${m.lead}</p>
      <div class="dayrow">${daySVG("sm")}<div class="bubble">${m.day}</div></div>
      ${lessons}
      ${checkHTML(m)}
      <div class="modfoot">
        <button class="btn ghost" ${curMod===0?'disabled style=opacity:.4':''} id="prevBtn">← 이전</button>
        ${done?`<span class="badge-pop">✓ 이 모듈 완료</span>`:''}
        <button class="btn" id="nextBtn">${curMod<MODULES.length-1?'다음 모듈 →':'풀어보기로 →'}</button>
      </div>
    </section></div>`;
  $("#app").querySelectorAll(".mnav button").forEach(b=>b.onclick=()=>{curMod=+b.dataset.m;render();window.scrollTo(0,0)});
  bindCheck(m);
  $("#prevBtn").onclick=()=>{if(curMod>0){curMod--;render();window.scrollTo(0,0)}};
  $("#nextBtn").onclick=()=>{store.done[m.id]=true;save();if(curMod<MODULES.length-1){curMod++;render();window.scrollTo(0,0)}else setMode("solve")};
}
function checkHTML(m){
  const c=m.check;if(!c)return"";
  if(c.type==="mc")return `<div class="check" id="chk"><div class="q"><span class="b">퀴즈</span><span>${c.q}</span></div>
    <div class="opts">${c.opts.map((o,i)=>`<button data-i="${i}">${o}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`;
  if(c.type==="order")return `<div class="check" id="chk"><div class="q"><span class="b">퍼즐</span><span>${c.q}</span></div>
    <div class="opts" id="orderpool">${c.items.slice().sort(()=>0.5-Math.random()).map(x=>`<button data-v="${x}">${x}</button>`).join("")}</div>
    <div class="pipe" id="orderpick" style="min-height:20px"></div><div class="fb" id="fb"></div></div>`;
  return"";
}
function bindCheck(m){
  const c=m.check;if(!c)return;
  if(c.type==="mc"){document.querySelectorAll("#chk .opts button").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===c.ans;b.classList.add(ok?"correct":"wrong");
    const fb=$("#fb");fb.className="fb show "+(ok?"ok":"no");fb.textContent=ok?("⭕ "+c.fb):"❌ 다시 생각해봐. Day 힌트: 위 레슨을 다시 보자!";
    if(ok)document.querySelectorAll("#chk .opts button").forEach(x=>x.disabled=true);});}
  if(c.type==="order"){const pick=[];
    document.querySelectorAll("#orderpool button").forEach(b=>b.onclick=()=>{
      if(b.disabled)return;b.disabled=true;b.style.opacity=.35;pick.push(b.dataset.v);
      $("#orderpick").innerHTML=pick.map((v,i)=>`<span class="st">${v}</span>${i<pick.length-1?'<span class="ar">→</span>':''}`).join("");
      if(pick.length===c.items.length){const ok=pick.join()===c.items.join();const fb=$("#fb");
        fb.className="fb show "+(ok?"ok":"no");fb.textContent=ok?("⭕ "+c.fb):"❌ 순서가 달라. 리셋하고 다시!";
        if(!ok){setTimeout(()=>render(),1200);}}
    });}
}

/* ===== 풀어보기 ===== */
function renderSolve(){
  const cards=CHALLENGES.map((c,i)=>{
    const a=store.answers[i]||"";
    return `<div class="qcard"><div class="meta"><span class="lv ${c.type}">${c.type==="recall"?"기존내용":"심화·창작"}</span><span>MODULE ${c.mod}</span></div>
      <div class="qt">${c.q}</div><div class="hint">힌트: ${c.hint}</div>
      <textarea data-i="${i}" placeholder="여기에 답안 작성 (코워크가 채점)">${a}</textarea>
      <span class="saved" id="sv${i}">저장됨</span></div>`;
  }).join("");
  $("#app").innerHTML=`<div class="wrap solve">
    <div class="solve-head">${daySVG("sm")}<h2>플로직 풀어보기</h2><div class="sp"></div>
      <input class="namein" id="learner" placeholder="이름" value="${store.learner||''}"></div>
    <div class="dayrow" style="margin-top:12px">${daySVG("sm")}<div class="bubble">기존 내용 질문과 심화 창작·퍼즐이 섞여 있어. 편하게 써봐 — 다 쓰면 아래 <b>답안 내보내기</b>로 JSON 저장하고, 코워크한테 채점받으면 돼!</div></div>
    ${cards}
    <div class="export-bar"><div class="in"><span class="cnt" id="ansCnt"></span><div class="sp" style="flex:1"></div>
      <button class="btn ghost" id="clearBtn">비우기</button>
      <button class="btn" id="exportBtn">답안 내보내기 (JSON)</button></div></div>`;
  $("#learner").oninput=e=>{store.learner=e.target.value;save()};
  document.querySelectorAll(".qcard textarea").forEach(t=>t.oninput=()=>{store.answers[t.dataset.i]=t.value;save();
    const sv=$("#sv"+t.dataset.i);sv.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>sv.classList.remove("show"),1000);updateCnt()});
  $("#exportBtn").onclick=exportAnswers;
  $("#clearBtn").onclick=()=>{if(confirm("답안을 모두 비울까요?")){store.answers={};save();render()}};
  updateCnt();
}
function updateCnt(){const n=CHALLENGES.filter((c,i)=>(store.answers[i]||"").trim()).length;const el=$("#ansCnt");if(el)el.textContent=`${n} / ${CHALLENGES.length} 작성됨`;}
function exportAnswers(){
  const out={tool:"PIMM-Plogic",mode:"풀어보기",learner:store.learner||"(이름 미기재)",
    note:"코워크 채점용. recall=기존내용 정확도, create=심화 창작/적용 품질을 플로직 기준으로 채점.",
    answers:CHALLENGES.map((c,i)=>({module:c.mod,type:c.type,question:c.q,answer:store.answers[i]||""}))};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`plogic_answers_${(store.learner||"noname").replace(/\s+/g,"")}.json`;a.click();
}

document.querySelectorAll("#modePills button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
setMode("home");
</script>
