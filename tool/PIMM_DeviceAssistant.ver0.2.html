<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIMM DeviceAssistant v0.2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{
    --bg:#0a0a0d; --panel:#0e0e12; --card:#141418; --card2:#1a1a20;
    --border:#26262c; --border2:#2f2f37;
    --accent:#00FF99; --accent-dim:rgba(0,255,153,0.13);
    --txt:#e6e6e6; --dim:#6a6a72; --dim2:#8a8a92;
    --red:#ff5566; --yellow:#ffcc44; --cyan:#44ddff; --violet:#9b7dd4; --orange:#ff8844; --pink:#ff66aa;
  }
  html,body { background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard',sans-serif; -webkit-font-smoothing:antialiased; }
  body{ min-height:100vh; }
  input,select,button,textarea { font-family:inherit; color:var(--txt); }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#2a2a32; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:#3a3a44; }
  code,.mono{ font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; }

  .inp{ padding:7px 10px; background:#1a1a1e; color:var(--txt); border:1px solid var(--border); border-radius:7px; font-size:12.5px; outline:none; transition:border-color .15s; }
  .inp:focus{ border-color:rgba(0,255,153,0.5); }
  .sel{ padding:7px 8px; background:#1a1a1e; color:var(--txt); border:1px solid var(--border); border-radius:7px; font-size:12.5px; outline:none; cursor:pointer; }
  .btn{ padding:7px 14px; border-radius:7px; cursor:pointer; font-size:12px; font-weight:700; border:1px solid var(--border2); background:var(--card2); color:var(--txt); transition:all .15s; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn:hover{ border-color:var(--dim2); }
  .btn-accent{ background:var(--accent-dim); color:var(--accent); border-color:rgba(0,255,153,0.35); }
  .btn-accent:hover{ background:rgba(0,255,153,0.2); }
  .btn-ghost{ background:transparent; border-color:var(--border); }
  .icon-btn{ background:transparent; border:none; cursor:pointer; color:var(--dim); padding:4px; border-radius:6px; display:inline-flex; transition:all .15s; }
  .icon-btn:hover{ color:var(--red); background:rgba(255,85,102,0.1); }

  .badge{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:5px; font-size:10px; font-weight:700; let-spacing:.5px; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th{ padding:8px 9px; text-align:left; color:var(--dim); font-weight:600; font-size:10px; letter-spacing:1px; text-transform:uppercase; border-bottom:1px solid var(--border); }
  td{ padding:6px 9px; border-bottom:1px solid rgba(255,255,255,0.035); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  .cell-inp{ width:100%; background:transparent; border:1px solid transparent; border-radius:5px; padding:5px 7px; font-size:12.5px; color:var(--txt); outline:none; }
  .cell-inp:hover{ border-color:var(--border); background:#1a1a1e; }
  .cell-inp:focus{ border-color:rgba(0,255,153,0.5); background:#1a1a1e; }
  select.cell-inp{ cursor:pointer; }

  .card{ background:var(--card); border:1px solid var(--border); border-radius:12px; }
  .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:12px 16px; background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:16px; }
  .lbl{ font-size:10px; color:var(--dim); font-weight:700; letter-spacing:1px; }
  .hint{ font-size:11px; color:var(--dim); line-height:1.55; }

  .tab-btn{ padding:12px 20px; font-size:12.5px; font-weight:600; color:var(--dim); background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; transition:all .15s; letter-spacing:.3px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .tab-btn:hover{ color:var(--dim2); }
  .tab-btn.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .tab-btn svg{ width:15px; height:15px; }

  .seqgroup{ border:1px solid var(--border); border-radius:12px; overflow:hidden; margin-bottom:14px; }
  .seqhead{ display:flex; align-items:center; gap:10px; padding:11px 15px; background:var(--card2); border-bottom:1px solid var(--border); }

  pre.md{ background:#0c0c10; border:1px solid var(--border); border-radius:10px; padding:18px; font-size:11.5px; line-height:1.6; color:#c8c8d0; overflow:auto; max-height:70vh; white-space:pre; }
  .proto-row{ display:flex; align-items:center; gap:10px; padding:9px 14px; border-radius:8px; background:var(--card); border:1px solid var(--border); margin-bottom:5px; }
  .kbd{ font-family:'SF Mono',monospace; background:#1a1a1e; border:1px solid var(--border); border-radius:5px; padding:3px 8px; font-size:11.5px; }

  @media (max-width:820px){
    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar .sel,.toolbar .inp{ width:100%; }
    .board-grid{ grid-template-columns:1fr !important; }
    .tab-btn{ padding:11px 13px; font-size:11px; }
    .tab-btn span{ display:none; }
    .table-wrap{ overflow-x:auto; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════
   PIMM_DeviceAssistant ver0.2  —  자체완결 단일 HTML (외부 의존성 0)
   ver0.2 신규: 와이어링뷰 (블루프린트 스키매틱 캔버스 · 노드 드래그 · SVG/PNG 내보내기)
   정본 규격: 260502 플로직매뉴얼 장치통신표준 개정판
   전신 툴: SerialTunner v0.4 (vanilla 재구축)
   ══════════════════════════════════════════════════════════════════ */

/* ─── 통신 규격 기본값 (260502 = 편집 가능한 기본값. 최종 규칙은 인터뷰로 확정 → 툴이 규칙을 정의) ─── */
const SPEC_DEFAULT = {
  baud: 115200,
  debounce: 50,
  pinMin: 22, pinMax: 53,     // 물리 핀 범위 (D22~D53)
  idBase: 1,                  // D(pinMin) = ID_(idBase). 기본: D22 = ID_01
  activeLow: true,
  hsInput: "PIMM_input", hsOutput: "PIMM_output", hsAck: "PIMM_ACK",
  inFmt:    "IN_{NN}",        // 입력 시리얼 템플릿  ({NN}=2자리 ID)
  outIdFmt: "OUT_{NN}",       // 출력 식별 stem
  outOnFmt: "OUT_{NN}_on",    // 출력 ON 명령
  outOffFmt:"OUT_{NN}_off",   // 출력 OFF 명령
  pwmFmt:   "OUT_{NN}_pwm_{VVV}", // PWM 명령 ({VVV}=0~255)
  ackResp:  "OK!",            // 출력 실행 응답
  pwmPins:  "44,45,46",       // PWM 지원 핀 (콤마 구분)
};
// spec 접근자 (런타임은 항상 state.spec 사용 — 편집 가능)
function sp(){ return state.spec; }
function pwmPinArr(){ return String(sp().pwmPins||"").split(",").map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)); }
function isPwmPin(pin){ return pwmPinArr().indexOf(pin) !== -1; }

// 핀-ID 매핑 (편집 가능: pinMin, idBase 기준)
function pinToId(pin){ return pin==null ? null : (pin - sp().pinMin + sp().idBase); }
function pinToNN(pin){ const id=pinToId(pin); return id==null ? "??" : String(id).padStart(2,"0"); }

// 시리얼 템플릿 적용
function applyFmt(tpl, nn, vvv){ return String(tpl||"").replace(/\{NN\}/g, nn).replace(/\{VVV\}/g, vvv==null?"VVV":vvv); }
function inSig(pin){ return applyFmt(sp().inFmt, pinToNN(pin)); }
function outOn(pin){ return applyFmt(sp().outOnFmt, pinToNN(pin)); }
function outOff(pin){ return applyFmt(sp().outOffFmt, pinToNN(pin)); }
function outPwm(pin){ return applyFmt(sp().pwmFmt, pinToNN(pin)); }

/* ─── 장치 라이브러리 (장치코드 = 260502 §5.3) ─── */
const DEVICE_LIB = {
  INPUT: [
    {code:"Btn", ko:"버튼"}, {code:"SW", ko:"스위치"}, {code:"SS", ko:"센서"},
    {code:"SS", ko:"레이저"}, {code:"Kpd", ko:"키패드"},
  ],
  OUTPUT: [
    {code:"Rly", ko:"릴레이"}, {code:"SSR", ko:"SSR"}, {code:"Ltx", ko:"조명"},
    {code:"Mtr", ko:"모터"}, {code:"Air", ko:"에어"}, {code:"Fog", ko:"포그"},
    {code:"Dcv", ko:"밸브"}, {code:"Lin", ko:"리니어"}, {code:"LED", ko:"LED"},
    {code:"Srv", ko:"서보"}, {code:"Sol", ko:"솔레노이드"}, {code:"Sir", ko:"사이렌"},
  ],
};
// role -> device option list
function devOptions(role){ return role==="OUTPUT" ? DEVICE_LIB.OUTPUT : DEVICE_LIB.INPUT; }
function deviceCode(ko){
  for(const g of [DEVICE_LIB.INPUT, DEVICE_LIB.OUTPUT]) for(const d of g) if(d.ko===ko) return d.code;
  return "Dev";
}
const TYPE_COLOR = {
  "버튼":"var(--accent)","스위치":"var(--cyan)","센서":"var(--violet)","레이저":"var(--red)","키패드":"var(--pink)",
  "릴레이":"var(--yellow)","SSR":"var(--yellow)","조명":"var(--cyan)","모터":"var(--orange)","에어":"var(--cyan)",
  "포그":"var(--dim2)","밸브":"var(--cyan)","리니어":"var(--orange)","LED":"var(--cyan)","서보":"var(--orange)",
  "솔레노이드":"var(--yellow)","사이렌":"var(--orange)",
};

const IO_MODES = ["INPUT_PULLUP","OUTPUT","PWM"];
const BOARD_ROLES = ["INPUT","OUTPUT","GAMING"];
const BOARD_COLORS = ["var(--accent)","var(--cyan)","var(--yellow)","var(--violet)","var(--orange)","var(--pink)"];
const ROLE_DEFAULT_MODE = { INPUT:"INPUT_PULLUP", OUTPUT:"OUTPUT", GAMING:"INPUT_PULLUP" };

const TAG_COLORS = { START:"var(--accent)", HIT:"var(--red)", STOP:"var(--yellow)", REMOTE:"var(--cyan)", SYSTEM:"var(--violet)" };
const SEQ_LIST = ["SEQ1","SEQ2","SEQ3","SEQ4","SEQ5","SEQ6"];  // -> combo_input_registry G1~G6

/* ─── 인라인 SVG 아이콘 (이모지 지양) ─── */
const IC = {
  chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="1.5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-10a6 6 0 1 1 12 0c0 4.4-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>',
  pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="12" rx="4"/><path d="M7 11v4M5 13h4M15.5 12.5h.01M18 15h.01"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l2-7 4 14 3-9 2 4h6"/></svg>',
  flow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 10h18M3 15h18M9 4v16M15 4v16"/></svg>',
  export:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
  download:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>',
  wiring:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="6" r="2"/><circle cx="5" cy="18" r="2"/><circle cx="19" cy="12" r="2"/><path d="M7 6h5a3 3 0 0 1 3 3v0a3 3 0 0 0 3 3M7 18h5a3 3 0 0 0 3-3"/></svg>',
};
function icon(n, sz){ return '<span style="display:inline-flex;width:'+(sz||15)+'px;height:'+(sz||15)+'px">'+IC[n]+'</span>'; }

/* ═══════════════════════════════════════════════════════════════════
   상태 + 자동저장 (localStorage)
   ═══════════════════════════════════════════════════════════════════ */
const LS_KEY = "pimm_device_assistant_v01";  // ver0.2 유지 (키 불변 — migrate()가 신규 필드 wire 보강)

function defaultState(){
  return {
    meta:{ projectName:"KLZ Laser Dodge", projectCode:"KLZ", mapNo:1, activeTab:"boards", wireBoard:"IN" },
    spec: Object.assign({}, SPEC_DEFAULT),
    wire:{ positions:{} },   // ver0.2: 와이어링뷰 노드 좌표 { [pin.uid]:{x,y} }
    boards:[
      { id:"IN",   role:"INPUT",  alias:"인풋보드",   color:0 },
      { id:"OUT",  role:"OUTPUT", alias:"아웃풋보드", color:1 },
      { id:"GAME", role:"GAMING", alias:"게이밍보드", color:3 },
    ],
    pins:[
      // INPUT
      { uid:uid(), board:"IN",  pin:22, mode:"INPUT_PULLUP", name:"시작버튼", type:"버튼", seq:"" },
      { uid:uid(), board:"IN",  pin:23, mode:"INPUT_PULLUP", name:"비상정지", type:"스위치", seq:"" },
      { uid:uid(), board:"IN",  pin:24, mode:"INPUT_PULLUP", name:"진입감지", type:"센서", seq:"" },
      // OUTPUT
      { uid:uid(), board:"OUT", pin:22, mode:"OUTPUT", name:"도어락", type:"릴레이", seq:"" },
      { uid:uid(), board:"OUT", pin:23, mode:"OUTPUT", name:"경광등",  type:"조명", seq:"" },
      { uid:uid(), board:"OUT", pin:44, mode:"PWM",    name:"LED바",   type:"LED", seq:"" },
      // GAMING (SEQ 그룹)
      { uid:uid(), board:"GAME", pin:22, mode:"INPUT_PULLUP", name:"레인1버튼", type:"버튼", seq:"SEQ1" },
      { uid:uid(), board:"GAME", pin:23, mode:"INPUT_PULLUP", name:"레인2버튼", type:"버튼", seq:"SEQ1" },
      { uid:uid(), board:"GAME", pin:24, mode:"INPUT_PULLUP", name:"정답버튼",  type:"버튼", seq:"SEQ2" },
      { uid:uid(), board:"GAME", pin:25, mode:"INPUT_PULLUP", name:"통과센서",  type:"레이저", seq:"SEQ2" },
    ],
    flows:[
      { id:1, tag:"START", text:"시작버튼(IN_01)이 눌리면 → 도어락 릴레이 ON(OUT_01_on) + PIMMplayer에 IN_01 전송" },
      { id:2, tag:"HIT",   text:"통과센서(IN_04, GAME)가 감지되면 → PIMMplayer에 IN_04 전송 (디바운스 50ms)" },
      { id:3, tag:"STOP",  text:"비상정지 스위치가 눌리면 → 전체 출력 OFF + 게임 상태 초기화" },
      { id:4, tag:"REMOTE",text:"PIMMplayer에서 OUT_02_on 수신 → 경광등 ON + OK! 응답" },
      { id:5, tag:"SYSTEM",text:"부팅 시 → PIMM_input/PIMM_output 송신, PIMM_ACK 수신 후 정상운영 진입" },
    ],
    protocols:[
      { id:1, name:"FLASH", category:"조명", desc:"빠른 점멸. 경고등·히트 피드백",
        params:[{label:"ON",value:"30ms"},{label:"OFF",value:"50ms"},{label:"반복",value:"5회"}],
        timing:[{state:"ON",dur:30},{state:"OFF",dur:50},{state:"ON",dur:30},{state:"OFF",dur:50},{state:"ON",dur:30},{state:"OFF",dur:50}],
        signal:"OUT_{NN}_on / OUT_{NN}_off ×5", example:"OUT_02_on" },
      { id:2, name:"PULSE", category:"제어", desc:"단발 ON 후 자동 OFF. 솔레노이드·자물쇠",
        params:[{label:"ON 유지",value:"100ms"}],
        timing:[{state:"ON",dur:100},{state:"OFF",dur:0}],
        signal:"OUT_{NN}_on → (100ms) → OUT_{NN}_off", example:"OUT_01_on" },
      { id:3, name:"FADE", category:"조명", desc:"PWM 디밍 (D44/45/46 전용). LED 페이드",
        params:[{label:"시작",value:"0"},{label:"끝",value:"255"},{label:"소요",value:"1000ms"}],
        timing:[{state:"▁",dur:200},{state:"▃",dur:200},{state:"▅",dur:200},{state:"▇",dur:200},{state:"█",dur:200}],
        signal:"OUT_{NN}_pwm_{VVV}", example:"OUT_23_pwm_255" },
    ],
  };
}
function uid(){ return "p"+Math.random().toString(36).slice(2,9); }

let state = loadState();
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw); if(s && s.boards && s.pins) return migrate(s); }
  }catch(e){ console.warn("load fail", e); }
  return defaultState();
}
function migrate(s){
  s.meta = s.meta || {}; if(!s.meta.activeTab) s.meta.activeTab="boards";
  if(s.meta.mapNo==null) s.meta.mapNo=1; if(!s.meta.projectCode) s.meta.projectCode="PIMM";
  s.spec = Object.assign({}, SPEC_DEFAULT, s.spec||{});   // 누락 규격 필드 = 기본값 보강
  s.pins.forEach(p=>{ if(!p.uid) p.uid=uid(); if(p.seq==null) p.seq=""; });
  // ver0.2: 와이어링뷰 필드 보강 (구 저장본 = {})
  if(!s.wire || typeof s.wire!=="object") s.wire={ positions:{} };
  if(!s.wire.positions || typeof s.wire.positions!=="object") s.wire.positions={};
  if(!s.meta.wireBoard || !s.boards.some(b=>b.id===s.meta.wireBoard)) s.meta.wireBoard=(s.boards[0]||{}).id||"";
  return s;
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{
    try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); flashSaved(); }
    catch(e){ console.warn("save fail", e); }
  }, 120);
}
function flashSaved(){
  const el=document.getElementById("save-ind"); if(!el) return;
  el.style.opacity="1"; clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.style.opacity="0.35"; }, 900);
}

/* ─── helpers ─── */
function boardById(id){ return state.boards.find(b=>b.id===id); }
function boardColor(b){ return BOARD_COLORS[(b.color||0)%BOARD_COLORS.length]; }
function pinsOf(id){ return state.pins.filter(p=>p.board===id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sanitizeName(s){ return String(s||"").replace(/\s+/g,"").replace(/[^0-9A-Za-z가-힣]/g,"")||"Dev"; }
function seqToG(seq){ const i=SEQ_LIST.indexOf(seq); return i>=0 ? "G"+(i+1) : ""; }

// 시리얼 ID (템플릿 기반, 편집 가능)
function serialId(p){
  const b=boardById(p.board); const nn=pinToNN(p.pin);
  return (b && b.role==="OUTPUT") ? applyFmt(sp().outIdFmt, nn) : applyFmt(sp().inFmt, nn);
}
// PIMM_ID 추천 (260502 §5) — 입력: Bl_[Map]_P_[Code][Name], 출력: Out_[Code]_[Name]
function pimmId(p){
  const b=boardById(p.board); const code=deviceCode(p.type); const nm=sanitizeName(p.name);
  const id=pinToId(p.pin);
  if(b && b.role==="OUTPUT") return "Out_"+code+"_"+nm;
  const mapN = (state.meta.mapNo||1)*100 + (id||0);
  return "Bl_"+mapN+"_P_"+code+nm;
}
function autoArrow(t){
  return t.replace(/(?<!=)>(?!=)/g,"→")
    .replace(/화살표\s*위/g,"↑").replace(/화살표\s*아래/g,"↓")
    .replace(/화살표\s*왼쪽/g,"←").replace(/화살표\s*오른쪽/g,"→");
}

function usedPins(boardId, exceptUid){
  return pinsOf(boardId).filter(p=>p.uid!==exceptUid && p.pin!=null).map(p=>p.pin);
}
function pinOptions(boardId, current, exceptUid){
  const used=usedPins(boardId, exceptUid);
  let o='<option value="">D?</option>';
  for(let d=sp().pinMin; d<=sp().pinMax; d++){
    const dis = used.indexOf(d)!==-1 && d!==current;
    o+='<option value="'+d+'"'+(d===current?' selected':'')+(dis?' disabled':'')+'>D'+d+' · ID_'+pinToNN(d)+(isPwmPin(d)?' ·PWM':'')+'</option>';
  }
  return o;
}

function sortPins(a,b){
  if(a.pin==null&&b.pin==null) return 0; if(a.pin==null) return 1; if(b.pin==null) return -1; return a.pin-b.pin;
}
function nextFreePin(boardId){
  const used=usedPins(boardId,null);
  for(let d=sp().pinMin; d<=sp().pinMax; d++) if(used.indexOf(d)===-1) return d;
  return null;
}
function bindPinCommon(){
  // add pin
  document.querySelectorAll('[data-addpin]').forEach(btn=>btn.onclick=()=>{
    const bid=btn.dataset.addpin; const b=boardById(bid);
    const opts=devOptions(b.role);
    state.pins.push({ uid:uid(), board:bid, pin:nextFreePin(bid), mode:ROLE_DEFAULT_MODE[b.role]||"INPUT_PULLUP",
      name:"", type:opts[0].ko, seq:b.role==="GAMING"?"SEQ1":"" });
    save(); render();
  });
  // delete pin
  document.querySelectorAll('[data-delpin]').forEach(btn=>btn.onclick=()=>{
    state.pins=state.pins.filter(p=>p.uid!==btn.dataset.delpin); save(); render();
  });
  // field edits
  document.querySelectorAll('.cell-inp[data-u]').forEach(el=>{
    const p=state.pins.find(x=>x.uid===el.dataset.u); if(!p) return;
    const f=el.dataset.f;
    if(el.tagName==="INPUT"){
      el.oninput=()=>{ p[f]=el.value; save(); };  // no re-render (keep focus)
    } else {
      el.onchange=()=>{
        if(f==="pin"){ p.pin = el.value===""?null:parseInt(el.value);
          if(p.pin!=null && !isPwmPin(p.pin) && p.mode==="PWM") p.mode="OUTPUT"; }
        else p[f]=el.value;
        save(); render();   // re-render: derived cells (시리얼/PIMM_ID/PWM) update
      };
    }
  });
}

  if(gb.length===0) return '<div class="hint">게이밍보드가 없습니다. 보드 탭에서 role=GAMING 보드를 추가하세요.</div>';
  let h='<div class="card" style="padding:13px 16px;margin-bottom:16px;background:linear-gradient(180deg,rgba(155,125,212,0.06),transparent)">'+
    '<div style="display:flex;align-items:center;gap:8px;color:var(--violet);font-weight:700;font-size:13px;margin-bottom:5px">'+icon("pad",15)+'게이밍보드 = 인풋보드2 (빠른 재매핑)</div>'+
    '<div class="hint"><b>인풋보드</b>는 시퀀스 진행신호 전용(안정·소수). <b>게이밍보드</b>는 게임 버튼/스위치가 세트당 많아 분화된 <b>인풋보드2</b>로, 게임마다 <b>빠르게 재매핑/피봇</b>하는 것이 핵심입니다. 시퀀스 영향은 작지만 SEQ# 그룹으로 묶어 게임에디터 <span class="mono">combo_input_registry</span>(SEQ1→G1 … SEQ6→G6)와 정합할 수 있습니다.</div>'+

    // 빠른 재매핑 툴바
    h+='<div class="toolbar" style="margin-bottom:10px">'+
      '<span class="lbl" style="color:'+c+'">빠른 재매핑 · '+esc(b.id)+'</span>'+
      '<select class="sel" data-fastseq="'+esc(b.id)+'" style="min-width:120px">'+SEQ_LIST.map(s=>'<option value="'+s+'">'+s+' ('+seqToG(s)+')</option>').join('')+'</select>'+
      '<input class="inp" type="number" min="1" max="32" value="4" data-fastn="'+esc(b.id)+'" style="width:66px" title="추가할 입력 개수">'+
      '<button class="btn btn-accent" data-fastadd="'+esc(b.id)+'">'+icon("plus",13)+'버튼 일괄추가</button>'+
      '<div style="flex:1"></div>'+
      '<button class="btn btn-ghost" data-fastclear="'+esc(b.id)+'" title="이 보드의 모든 핀 삭제">'+icon("trash",12)+'보드 비우기</button>'+
    '</div>';
    // full editable table
    h+='<div style="margin-bottom:8px">'+pinTable(b, true)+'</div>';
    // SEQ 그룹 요약
    h+='<div style="margin:10px 0 26px">';
    const ps=pinsOf(b.id);
    const groups={}; ps.forEach(p=>{ const k=p.seq||"(미지정)"; (groups[k]=groups[k]||[]).push(p); });
    const order=SEQ_LIST.concat(["(미지정)"]).filter(k=>groups[k]);
    order.forEach(k=>{

function bindGaming(){
  const addInputs=(bid, seq, n)=>{
    const b=boardById(bid); const opts=devOptions(b.role);
    for(let i=0;i<n;i++){
      const pin=nextFreePin(bid); if(pin==null){ alert("빈 핀이 없습니다 (D"+sp().pinMin+"~D"+sp().pinMax+" 소진)."); break; }
      state.pins.push({ uid:uid(), board:bid, pin, mode:ROLE_DEFAULT_MODE[b.role]||"INPUT_PULLUP",
        name:seq+"-"+String(pinsOf(bid).filter(p=>p.seq===seq).length+1), type:opts[0].ko, seq });
    }
    save(); render();
  };
  document.querySelectorAll('[data-fastadd]').forEach(btn=>btn.onclick=()=>{
    const bid=btn.dataset.fastadd;
    const seq=(document.querySelector('[data-fastseq="'+bid+'"]')||{}).value||"SEQ1";
    const n=Math.max(1, parseInt((document.querySelector('[data-fastn="'+bid+'"]')||{}).value)||1);
    addInputs(bid, seq, n);
  });
  document.querySelectorAll('[data-seqadd]').forEach(btn=>btn.onclick=()=>{
    const [bid,seq]=btn.dataset.seqadd.split("|"); addInputs(bid, seq, 1);
  });
  document.querySelectorAll('[data-fastclear]').forEach(btn=>btn.onclick=()=>{
    const bid=btn.dataset.fastclear;
    if(confirm("게이밍보드 "+bid+"의 모든 핀을 삭제합니다.")){ state.pins=state.pins.filter(p=>p.board!==bid); save(); render(); }
  });
}

function protoLine(dir,color,line,desc){
  return '<div class="proto-row" style="flex:1;min-width:180px">'+
    '<span class="badge" style="background:'+color+'22;color:'+color+'">'+esc(dir)+'</span>'+
    '<code class="mono" style="color:'+color+';font-weight:700;font-size:12.5px">'+esc(line)+'</code>'+
    '<span style="font-size:10.5px;color:var(--dim);margin-left:auto">'+esc(desc)+'</span></div>';
}
function timingBar(timing){
  if(!timing||!timing.length) return '';
  const total=timing.reduce((s,t)=>s+(t.dur||40),0);
  let h='<div style="display:flex;height:26px;border-radius:6px;overflow:hidden;background:#0c0c10;border:1px solid var(--border)">';
  timing.forEach((t,i)=>{
    const w= total>0 ? Math.max((t.dur||40)/total*100,7) : 100/timing.length;
    const on = t.state.includes("ON")||"█▇▅".includes(t.state);
    const partial="▃▁".includes(t.state);
    let bg = on?"rgba(0,255,153,0.33)":(partial?"rgba(0,255,153,0.13)":(t.state.includes("OFF")?"rgba(255,255,255,0.03)":"transparent"));
    h+='<div style="width:'+w+'%;display:flex;align-items:center;justify-content:center;background:'+bg+';border-right:'+(i<timing.length-1?'1px solid rgba(255,255,255,0.05)':'none')+';font-size:9px;color:'+(on?'var(--accent)':'var(--dim)')+'" class="mono">'+esc(t.dur>0?t.state+' '+t.dur+'ms':t.state)+'</div>';
  });
  return h+'</div>';
}
function bindProtocol(){
  const add=document.getElementById("proto-add");
  if(add) add.onclick=()=>{
    const name=(prompt("규격명 (예: BLINK)")||"").trim().toUpperCase(); if(!name) return;
    const desc=(prompt("설명")||"").trim();
    const signal=(prompt("시리얼 시그널 (예: OUT_{NN}_on)")||"").trim();
    const maxId=state.protocols.reduce((m,p)=>Math.max(m,p.id),0);
    state.protocols.push({ id:maxId+1, name, category:"연출", desc, params:[],
      timing:[{state:"ON",dur:100},{state:"OFF",dur:0}], signal, example:signal });
    save(); render();
  };
  document.querySelectorAll('[data-delproto]').forEach(b=>b.onclick=()=>{
    state.protocols=state.protocols.filter(p=>p.id!=b.dataset.delproto); save(); render();
  });
}

function bindFlow(){
  const add=document.getElementById("fl-add");
  const doAdd=()=>{
    const t=document.getElementById("fl-text"); const tag=document.getElementById("fl-tag").value;
    const text=autoArrow((t.value||"").trim()); if(!text) return;
    const maxId=state.flows.reduce((m,f)=>Math.max(m,f.id),0);
    state.flows.push({ id:maxId+1, tag, text }); save(); render();
  };
  if(add) add.onclick=doAdd;
  const ti=document.getElementById("fl-text");
  if(ti) ti.onkeydown=(e)=>{ if(e.key==="Enter") doAdd(); };
  document.querySelectorAll('[data-flowedit]').forEach(i=>{
    i.oninput=()=>{ const f=state.flows.find(x=>x.id==i.dataset.flowedit); if(f){ const s=i.selectionStart; f.text=autoArrow(i.value); if(i.value!==f.text){ i.value=f.text; i.setSelectionRange(s,s);} save(); } };
  });
  document.querySelectorAll('[data-delflow]').forEach(b=>b.onclick=()=>{
    state.flows=state.flows.filter(f=>f.id!=b.dataset.delflow); save(); render();
  });
}

/* ═══ TAB: REGISTRY (PIMM_Registry) ═══ */
function registryRows(){
  const rows=[];
  state.pins.filter(p=>p.pin!=null).forEach(p=>{
    const b=boardById(p.board); if(!b) return;
    const roleR = b.role==="OUTPUT" ? "OUTPUT" : "INPUT"; // GAMING은 INPUT 계열
    rows.push({
      boardRole: roleR, boardId:b.id, pin:"D"+p.pin, serialId:serialId(p),
      project:state.meta.projectCode, code:deviceCode(p.type), type:p.type,
      name:p.name, seq:p.seq||"", g:seqToG(p.seq), pimmId:pimmId(p), mode:p.mode,
    });
  });
  rows.sort((a,b)=>{ if(a.boardId!==b.boardId) return a.boardId<b.boardId?-1:1; return a.serialId<b.serialId?-1:1; });
  return rows;
}

      '<td class="mono" style="color:var(--dim2)">'+esc(r.code)+'</td>'+
      '<td>'+esc(r.name||'-')+' <span style="color:var(--dim);font-size:10px">'+esc(r.type)+'</span></td>'+
      '<td class="mono" style="color:var(--violet)">'+(r.seq?esc(r.seq)+(r.g?' · '+r.g:''):'-')+'</td>'+
      '<td class="mono" style="color:var(--dim2)">'+esc(r.project)+'</td>'+
      '<td class="mono" style="color:var(--cyan);font-size:11px">'+esc(r.pimmId)+'</td>'+
      '<td class="mono" style="color:var(--dim);font-size:10px">'+esc(r.mode)+'</td>'+
    '</tr>';
  });
  if(rows.length===0) h+='<tr><td colspan="10" style="text-align:center;color:var(--dim);padding:16px">매핑된 핀 없음</td></tr>';
  h+='</tbody></table></div>';
  return h;
}
function registryCSV(){
  const head=["Board Role","Board","Pin","Serial ID","Type Code","Device Name","SEQ","G","Project","PIMM_ID","Mode"];
  const rows=registryRows().map(r=>[r.boardRole,r.boardId,r.pin,r.serialId,r.code,r.name,r.seq,r.g,r.project,r.pimmId,r.mode]);
  const enc=v=>{ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
  return [head].concat(rows).map(r=>r.map(enc).join(",")).join("\n");
}
function bindRegistry(){
  const csv=document.getElementById("reg-csv");
  if(csv) csv.onclick=()=>downloadFile(safeName()+"_PIMM_Registry.csv", registryCSV(), "text/csv;charset=utf-8");
  const cp=document.getElementById("reg-copy");
  if(cp) cp.onclick=()=>copyText(registryCSV(), cp);
}

/* ═══ TAB: HANDOFF ═══ */
function generateHandoff(){
  const m=state.meta;
  const ts=new Date().toISOString().slice(0,16).replace("T"," ");
  let d="# "+m.projectName+" — PIMM DeviceAssistant HANDOFF\n";
  d+="> Generated: "+ts+" · Project Code: `"+m.projectCode+"` · MAP base: "+m.mapNo+"\n";
  d+="> 규격(편집가능·기본값 260502): Baud "+sp().baud+" · 디바운스 "+sp().debounce+"ms · 핀 D"+sp().pinMin+"~D"+sp().pinMax+" = ID_"+String(sp().idBase).padStart(2,"0")+"~\n\n---\n\n";

  d+="## BOARDS\n\n| Board | Role | 별칭 | Pins |\n|---|---|---|---|\n";
  state.boards.forEach(b=>{ d+="| `"+b.id+"` | "+b.role+" | "+b.alias+" | "+pinsOf(b.id).length+" |\n"; });
  d+="\n";

  d+="## PIN MAP\n\n";
  state.boards.forEach(b=>{
    const ps=pinsOf(b.id).slice().sort(sortPins); if(!ps.length) return;
    d+="### "+b.id+" — "+b.alias+" ("+b.role+")\n\n";
    const gaming=b.role==="GAMING";
    d+=gaming ? "| Pin | ID | Serial | SEQ/G | 장치명 | 타입(코드) | 모드 |\n|---|---|---|---|---|---|---|\n"
             : "| Pin | ID | Serial | 장치명 | 타입(코드) | 모드 | PIMM_ID |\n|---|---|---|---|---|---|---|\n";
    ps.forEach(p=>{
      const idn="ID_"+pinToNN(p.pin);
      if(gaming) d+="| D"+p.pin+" | "+idn+" | `"+serialId(p)+"` | "+(p.seq||"-")+(seqToG(p.seq)?" / "+seqToG(p.seq):"")+" | "+p.name+" | "+p.type+"("+deviceCode(p.type)+") | "+p.mode+" |\n";
      else d+="| D"+p.pin+" | "+idn+" | `"+serialId(p)+"` | "+p.name+" | "+p.type+"("+deviceCode(p.type)+") | "+p.mode+" | `"+pimmId(p)+"` |\n";
    });
    d+="\n";
  });

  // Gaming SEQ 그룹
  const gb=state.boards.filter(b=>b.role==="GAMING");
  if(gb.length){
    d+="## GAMING SEQUENCE GROUPS (combo_input_registry)\n\n";
    gb.forEach(b=>{
      const ps=pinsOf(b.id); const groups={};
      ps.forEach(p=>{ const k=p.seq||"(미지정)"; (groups[k]=groups[k]||[]).push(p); });
      SEQ_LIST.concat(["(미지정)"]).filter(k=>groups[k]).forEach(k=>{
        d+="### "+b.id+" · "+k+(seqToG(k)?" ↔ "+seqToG(k):"")+"\n\n";
        groups[k].slice().sort(sortPins).forEach(p=>{ d+="- `"+serialId(p)+"` D"+(p.pin==null?"?":p.pin)+" — "+(p.name||"(무명)")+" ["+p.type+"]\n"; });
        d+="\n";
      });
    });
  }

  // WIRING (와이어링뷰 인접목록 — 시각본은 SVG/PNG로 별도 내보내기)
  d+="## WIRING (핀 + GND 배선 · 260502)\n\n";
  d+="> 각 장치 = 시그널 핀 1개 + 공통 GND. 출력은 외부 12V/MOSFET 구동.\n\n";
  state.boards.forEach(b=>{
    const ps=pinsOf(b.id).filter(p=>p.pin!=null).slice().sort(sortPins); if(!ps.length) return;
    d+="### "+b.id+" — "+b.alias+" ("+b.role+")\n\n";
    d+="```\n";
    ps.forEach(p=>{
      const sid=serialId(p); const pwr=b.role==="OUTPUT"?"  +12V/MOSFET":"";
      d+=sid.padEnd(8)+" D"+String(p.pin).padEnd(3)+" ── ["+(p.name||"(무명)")+"/"+p.type+(p.seq?"/"+p.seq:"")+"]  +GND"+pwr+"\n";
    });
    d+="```\n\n";
  });

  d+="## SERIAL PROTOCOL (규격 편집가능 · 기본값 260502)\n\n";
  d+="**Handshake:** 보드→PC `"+sp().hsInput+"` / `"+sp().hsOutput+"`, PC→보드 `"+sp().hsAck+"` (all `\\n` 종결)\n\n";
  const inP=state.pins.filter(p=>{const b=boardById(p.board);return b&&b.role!=="OUTPUT"&&p.pin!=null;}).sort((a,b)=>serialId(a)<serialId(b)?-1:1);
  const outP=state.pins.filter(p=>{const b=boardById(p.board);return b&&b.role==="OUTPUT"&&p.pin!=null;}).sort((a,b)=>serialId(a)<serialId(b)?-1:1);
  d+="**입력 (보드→PC, `"+sp().inFmt+"`"+(sp().activeLow?" · 활성 LOW":"")+" · "+sp().debounce+"ms):**\n\n";
  inP.forEach(p=>{ d+="- `"+inSig(p.pin)+"` — "+(p.name||"-")+(p.seq?" ["+p.seq+"]":"")+"\n"; });
  d+="\n**출력 (PC→보드, 멱등, 응답 `"+sp().ackResp+"`):**\n\n";
  outP.forEach(p=>{
    d+="- `"+outOn(p.pin)+"` / `"+outOff(p.pin)+"`"+(isPwmPin(p.pin)?" / `"+outPwm(p.pin)+"`":"")+" — "+(p.name||"-")+"\n"; });
  d+="\n";
  if(state.protocols.length){
    d+="**커스텀 규격:**\n\n";
    state.protocols.forEach(pr=>{ d+="- **"+pr.name+"** ("+pr.category+") — "+pr.desc+" · signal `"+pr.signal+"` · ex `"+pr.example+"`\n"; });
    d+="\n";
  }

  d+="## DEVICE FLOW\n\n";
  const grouped={}; state.flows.forEach(f=>{ (grouped[f.tag]=grouped[f.tag]||[]).push(f); });
  Object.keys(TAG_COLORS).filter(t=>grouped[t]).forEach(tag=>{
    d+="### "+tag+"\n\n";
    grouped[tag].forEach(f=>{ d+="- ["+String(f.id).padStart(2,"0")+"] "+f.text+"\n"; });
    d+="\n";
  });

  d+="## PIMM_Registry\n\n";
  d+="| Board Role | Board | Pin | Serial | Type | Device | SEQ/G | Project | PIMM_ID | Mode |\n|---|---|---|---|---|---|---|---|---|---|\n";
  registryRows().forEach(r=>{ d+="| "+r.boardRole+" | "+r.boardId+" | "+r.pin+" | `"+r.serialId+"` | "+r.code+" | "+r.name+" | "+(r.seq?r.seq+(r.g?"/"+r.g:""):"-")+" | "+r.project+" | `"+r.pimmId+"` | "+r.mode+" |\n"; });
  d+="\n---\n\n_PIMM DeviceAssistant ver0.2 — HANDOFF · 260502 장치통신표준 준수_\n";
  return d;
}

    '<button class="btn btn-accent" id="ho-md">'+icon("download",13)+'HANDOFF.md 다운로드</button>'+
    '<button class="btn btn-ghost" id="ho-json">'+icon("download",13)+'프로젝트 JSON</button>'+

  '</div>';

function bindHandoff(){
  const md=document.getElementById("ho-md");
  if(md) md.onclick=()=>downloadFile(safeName()+"_HANDOFF.md", generateHandoff(), "text/markdown;charset=utf-8");

      catch(err){ alert("JSON 파싱 실패: "+err.message); } };

/* ═══════════════════════════════════════════════════════════════════
   TAB: WIRING VIEW (와이어링뷰) — 블루프린트 스키매틱 캔버스  [ver0.2]
   보드 핀헤더 + 장치노드 + 와이어(핀+GND). 노드 드래그·인라인 편집·SVG/PNG 내보내기.
   좌표계 = SVG userSpace (viewBox=0..W,0..H). 색상 = hex (독립 SVG 내보내기 위해 CSS var 미사용).
   ═══════════════════════════════════════════════════════════════════ */
// :root CSS 변수 → hex (내보낸 SVG가 스탠드얼론으로 열리도록)
const CVAR = {
  "--bg":"#0a0a0d","--panel":"#0e0e12","--card":"#141418","--card2":"#1a1a20",
  "--border":"#26262c","--border2":"#2f2f37","--accent":"#00FF99",
  "--txt":"#e6e6e6","--dim":"#6a6a72","--dim2":"#8a8a92",
  "--red":"#ff5566","--yellow":"#ffcc44","--cyan":"#44ddff","--violet":"#9b7dd4","--orange":"#ff8844","--pink":"#ff66aa",
};
function cssHex(v){ if(typeof v==="string"&&v.startsWith("var(")){ return CVAR[v.slice(4,-1)]||"#8a8a92"; } return v||"#8a8a92"; }
function boardHex(b){ return cssHex(boardColor(b)); }
function typeHex(t){ return cssHex(TYPE_COLOR[t]||"var(--dim2)"); }
// SEQ# 팔레트 (게이밍 노드 SEQ별 색상 · 바이올렛 계열)
const SEQ_HEX = ["#9b7dd4","#7d9bd4","#b47dd4","#d47bb4","#7dc9d4","#c9b47d"];
function seqHex(seq){ const i=SEQ_LIST.indexOf(seq); return i>=0 ? SEQ_HEX[i%SEQ_HEX.length] : "#6a6a72"; }
// 노드 색상: 게이밍+SEQ면 SEQ색, 아니면 보드색
function nodeHex(p,b){ if(b && b.role==="GAMING" && p.seq) return seqHex(p.seq); return boardHex(b); }
const WMONO = "'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace";

// 와이어링 캔버스 지오메트리 상수
const WG = { W:1160, boardX:40, boardW:196, topY:26, headTop:114, pinPitch:18.6,
             padOut:14, NW:158, NH:50, colW:206, rowH:74, layoutX0:340, gndPad:46 };

function wireBoardObj(){ return boardById(state.meta.wireBoard) || state.boards[0]; }
// 선택 보드의 노드 대상 핀 (핀번호 존재)
function wireNodes(b){ return pinsOf(b.id).filter(p=>p.pin!=null).slice().sort(sortPins); }
function pinRowY(p){ return WG.headTop + (p.pin - sp().pinMin)*WG.pinPitch; }

// 오토레이아웃: 저장 좌표 없는 노드를 컬럼 배치
function nodePos(p, idx){
  const saved = state.wire.positions[p.uid];
  if(saved && typeof saved.x==="number" && typeof saved.y==="number") return { x:saved.x, y:saved.y, auto:false };
  const availW = WG.W - WG.layoutX0 - 24;
  const cols = Math.max(1, Math.floor(availW / WG.colW));
  const col = idx % cols, row = Math.floor(idx / cols);
  return { x: WG.layoutX0 + col*WG.colW, y: WG.headTop + row*WG.rowH, auto:true };
}
function wireCanvasH(b){
  const nodes=wireNodes(b);
  const availW = WG.W - WG.layoutX0 - 24;
  const cols = Math.max(1, Math.floor(availW / WG.colW));
  const headBottom = WG.headTop + 32*WG.pinPitch;
  let maxY = headBottom;
  nodes.forEach((p,i)=>{ const q=nodePos(p,i); maxY=Math.max(maxY, q.y+WG.NH); });
  return Math.round(maxY + WG.gndPad + 46);
}

/* ─── 장치 스키매틱 심볼 (코드→미니 SVG · 0..24 박스, stroke=color) ─── */
function symGlyph(code, color){
  const s='stroke="'+color+'" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  const F='fill="'+color+'"';
  switch(code){
    case "Btn": // 푸시버튼: 접점 + 플런저
      return '<g '+s+'><path d="M3 15h5M16 15h5"/><path d="M8 15h8"/><path d="M12 15V8M9 8h6"/></g>';
    case "SW":  // 스위치 레버(SPST)
      return '<g '+s+'><circle cx="4" cy="16" r="1.6"/><circle cx="20" cy="16" r="1.6"/><path d="M5.4 15.4 18 9"/></g>';
    case "SS":  // 센서/레이저: 방출 웨이브
      return '<g '+s+'><circle cx="6" cy="12" r="2.4"/><path d="M11 8c2.4 2.2 2.4 5.8 0 8M14.5 6c3.6 3.2 3.6 8.8 0 12"/></g>';
    case "Kpd": // 키패드: 3x3 도트
      return '<g '+F+'><circle cx="7" cy="7" r="1.3"/><circle cx="12" cy="7" r="1.3"/><circle cx="17" cy="7" r="1.3"/><circle cx="7" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="17" cy="12" r="1.3"/><circle cx="7" cy="17" r="1.3"/><circle cx="12" cy="17" r="1.3"/><circle cx="17" cy="17" r="1.3"/></g>';
    case "Rly": case "SSR": // 릴레이: 코일 + 접점
      return '<g '+s+'><rect x="3" y="8" width="8" height="8" rx="1"/><path d="M5 10.5h4M5 13.5h4"/><path d="M13 12h3l4-3"/><circle cx="20" cy="9" r="1.2"/></g>';
    case "Ltx": case "Sir": // 조명/사이렌: 램프 (원 + X)
      return '<g '+s+'><circle cx="12" cy="12" r="6"/><path d="M8 8l8 8M16 8l-8 8"/></g>';
    case "LED": // LED: 다이오드 삼각 + 바 + 방출
      return '<g '+s+'><path d="M7 7v10l8-5z"/><path d="M15 7v10"/><path d="M17 6l2-2M19 8l2-2"/></g>';
    case "Mtr": case "Srv": case "Lin": // 모터/서보/리니어: 원 + M
      return '<g '+s+'><circle cx="12" cy="12" r="6.5"/><path d="M9 15V9l3 3 3-3v6"/></g>';
    case "Sol": case "Dcv": case "Air": // 솔레노이드/밸브/에어: 코일
      return '<g '+s+'><path d="M4 12h2M18 12h2"/><path d="M6 8c0 4 0 4 2.4 0M8.4 8c0 4 0 4 2.4 0M10.8 8c0 4 0 4 2.4 0M13.2 8c0 4 0 4 2.4 0"/></g>';
    case "Fog": // 포그: 구름 웨이브
      return '<g '+s+'><path d="M4 14h16M4 17h16M8 11c0-2 2-3 3-3M13 8c2 0 3 1.4 3 3"/></g>';
    default:
      return '<g '+s+'><rect x="5" y="7" width="14" height="10" rx="1.5"/></g>';
  }
}

/* ─── SVG 문자열 빌더 ─── */
function wireSvgMarkup(b){
  const g=WG, W=g.W, H=wireCanvasH(b);
  const bx=g.boardX, bw=g.boardW, brx=bx+bw;                 // 보드 우측 엣지
  const padTip=brx+g.padOut;                                  // 핀 패드 끝점
  const gndY=H-g.gndPad;                                      // GND 버스 y
  const bhex=boardHex(b);
  const nodes=wireNodes(b);
  const usedPinSet={}; nodes.forEach(p=>usedPinSet[p.pin]=p);
  const headBottom = g.headTop + 32*g.pinPitch;
  const boardBottom = headBottom + 12;
  let s='';

  // defs: 블루프린트 그리드
  s+='<defs>'+
    '<pattern id="wg1" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/></pattern>'+
    '<pattern id="wg2" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#00FF99" stroke-opacity="0.045" stroke-width="1"/></pattern>'+
    '<marker id="wdot" markerWidth="6" markerHeight="6" refX="3" refY="3"><circle cx="3" cy="3" r="2" fill="#8a8a92"/></marker>'+
  '</defs>';
  // 배경 + 그리드
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#0a0a0d"/>';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#wg1)"/>';
  s+='<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="url(#wg2)"/>';
  // 코너 프레임/타이틀 블록 (기술 도면 느낌)
  s+='<rect x="8" y="8" width="'+(W-16)+'" height="'+(H-16)+'" fill="none" stroke="#26262c" stroke-width="1"/>';
  s+='<text x="'+(W-16)+'" y="'+(H-18)+'" text-anchor="end" font-family="'+WMONO+'" font-size="10" fill="#6a6a72">PIMM DEVICEASSISTANT · WIRING · '+esc(state.meta.projectCode||"")+' · '+esc(b.id)+' / '+b.role+'</text>';

  // ── GND 버스 (하단 수평 레일) ──
  s+='<line x1="'+bx+'" y1="'+gndY+'" x2="'+(W-24)+'" y2="'+gndY+'" stroke="#5a5a64" stroke-width="2.5"/>';
  for(let gx=bx+8; gx<W-30; gx+=90){ s+='<path d="M'+gx+' '+(gndY+4)+'h12M'+(gx+2)+' '+(gndY+7)+'h8M'+(gx+4)+' '+(gndY+10)+'h4" stroke="#5a5a64" stroke-width="1.4" fill="none"/>'; }
  s+='<text x="'+bx+'" y="'+(gndY-6)+'" font-family="'+WMONO+'" font-size="10" fill="#8a8a92">GND BUS · 공통접지 (star)</text>';

  // ── 보드 본체 ──
  s+='<rect x="'+bx+'" y="'+g.topY+'" width="'+bw+'" height="'+(boardBottom-g.topY)+'" rx="7" fill="#101014" stroke="'+bhex+'" stroke-width="1.6" stroke-opacity="0.85"/>';
  s+='<rect x="'+bx+'" y="'+g.topY+'" width="'+bw+'" height="26" rx="7" fill="'+bhex+'" fill-opacity="0.10"/>';
  s+='<text x="'+(bx+12)+'" y="'+(g.topY+17)+'" font-family="'+WMONO+'" font-size="11.5" font-weight="700" fill="'+bhex+'">ARDUINO MEGA 2560</text>';
  s+='<text x="'+(bx+12)+'" y="'+(g.topY+42)+'" font-family="'+WMONO+'" font-size="10" fill="#8a8a92">'+esc(b.id)+' · '+b.role+' · '+esc(b.alias||"")+'</text>';
  // 5V / GND 전원패드 (보드 상단)
  const pwrY=g.topY+52;
  s+='<circle cx="'+(brx-10)+'" cy="'+pwrY+'" r="3.4" fill="#ff5566"/><text x="'+(brx-20)+'" y="'+(pwrY+3.5)+'" text-anchor="end" font-family="'+WMONO+'" font-size="9.5" fill="#ff5566">5V</text>';
  const bgY=pwrY+16;
  s+='<circle cx="'+(brx-10)+'" cy="'+bgY+'" r="3.4" fill="#5a5a64"/><text x="'+(brx-20)+'" y="'+(bgY+3.5)+'" text-anchor="end" font-family="'+WMONO+'" font-size="9.5" fill="#8a8a92">GND</text>';
  // 보드 GND 패드 → GND 버스 연결선
  s+='<path d="M'+(brx-10)+' '+(bgY+3.4)+' V'+(gndY)+'" stroke="#5a5a64" stroke-width="1.4" stroke-dasharray="3 3" fill="none"/>';

  // ── 핀 헤더 (D22..D53) ──
  for(let d=sp().pinMin; d<=sp().pinMax; d++){
    const y=g.headTop + (d-sp().pinMin)*g.pinPitch;
    const hasDev=!!usedPinSet[d]; const pwm=isPwmPin(d);
    const col = hasDev ? bhex : "#3a3a44";
    // 라벨 (보드 내부, 우측정렬): D## · ID_NN
    s+='<text x="'+(brx-24)+'" y="'+(y+3.4)+'" text-anchor="end" font-family="'+WMONO+'" font-size="9.5" fill="'+(hasDev?"#c8c8d0":"#5a5a64")+'">D'+d+' · ID_'+pinToNN(d)+(pwm?" ·P":"")+'</text>';
    // 패드 (엣지 밖으로 돌출)
    s+='<line x1="'+(brx-2)+'" y1="'+y+'" x2="'+padTip+'" y2="'+y+'" stroke="'+col+'" stroke-width="'+(hasDev?2:1.2)+'"/>';
    s+='<circle cx="'+padTip+'" cy="'+y+'" r="'+(hasDev?3.2:2.2)+'" fill="'+(hasDev?col:"#0a0a0d")+'" stroke="'+col+'" stroke-width="1.2"/>';
  }

  // ── 와이어 (심볼 밑에 깔리도록 먼저) + 노드 ──
  let wires='', nodesMk='';
  nodes.forEach((p,i)=>{
    const q=nodePos(p,i); const nx=q.x, ny=q.y;
    const b2=b; const nhex=nodeHex(p,b2); const code=deviceCode(p.type);
    const py=pinRowY(p);                          // 헤더 패드 y
    const lcx=nx, lcy=ny+g.NH/2;                  // 노드 좌측 커넥터
    const bcx=nx+g.NW/2, bcy=ny+g.NH;             // 노드 하단 커넥터(→GND)
    // 시그널 와이어 (핀 → 노드 좌측), 엘보
    const chx=Math.max(padTip+26, nx-28);
    wires+='<path id="wsig-'+p.uid+'" data-wsig="'+p.uid+'" d="'+sigPath(padTip,py,chx,lcx,lcy)+'" fill="none" stroke="'+nhex+'" stroke-width="1.5" stroke-opacity="0.85"/>';
    // GND 와이어 (노드 하단 → GND 버스)
    wires+='<path id="wgnd-'+p.uid+'" data-wgnd="'+p.uid+'" d="'+gndPath(bcx,bcy,gndY)+'" fill="none" stroke="#6a6a72" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#wdot)"/>';

    // 노드 그룹
    const sid=serialId(p); const isOut=b2.role==="OUTPUT";
    let ng='<g class="wnode" data-node="'+p.uid+'" transform="translate('+nx+','+ny+')" style="cursor:grab">';
    ng+='<rect x="0" y="0" width="'+g.NW+'" height="'+g.NH+'" rx="7" fill="#141418" stroke="'+nhex+'" stroke-width="1.5"/>';
    ng+='<rect x="0" y="0" width="4" height="'+g.NH+'" rx="2" fill="'+nhex+'"/>';
    // 좌측 커넥터 점
    ng+='<circle cx="0" cy="'+(g.NH/2)+'" r="3" fill="'+nhex+'"/>';
    ng+='<circle cx="'+(g.NW/2)+'" cy="'+g.NH+'" r="2.6" fill="#6a6a72"/>';
    // 심볼
    ng+='<g transform="translate(10,'+((g.NH-24)/2)+')">'+symGlyph(code,nhex)+'</g>';
    // 텍스트: 장치명 / 시리얼·핀·타입
    ng+='<text id="wlbl-'+p.uid+'" x="40" y="20" font-family="'+WMONO+'" font-size="12" font-weight="700" fill="#e6e6e6">'+esc(wireClip(p.name||"(무명)",15))+'</text>';
    ng+='<text x="40" y="35" font-family="'+WMONO+'" font-size="9.5" fill="'+nhex+'">'+esc(sid)+' · D'+p.pin+'</text>';
    ng+='<text x="40" y="46" font-family="'+WMONO+'" font-size="9" fill="#8a8a92">'+esc(p.type)+(p.seq?" · "+esc(p.seq):"")+(isOut?" · 12V/MOSFET":"")+'</text>';
    ng+='</g>';
    nodesMk+=ng;
  });
  s+='<g id="wwires">'+wires+'</g>';
  s+=nodesMk;

  if(nodes.length===0){
    s+='<text x="'+(g.layoutX0)+'" y="'+(g.headTop+30)+'" font-family="'+WMONO+'" font-size="12" fill="#6a6a72">이 보드에 핀이 없습니다 — 핀맵/게이밍 탭에서 추가하세요.</text>';
  }
  return { svg:s, W:W, H:H };
}
function sigPath(padTip,py,chx,lcx,lcy){
  return "M"+padTip+" "+py+" L"+chx+" "+py+" L"+chx+" "+lcy+" L"+lcx+" "+lcy;
}
function gndPath(bcx,bcy,gndY){
  return "M"+bcx+" "+bcy+" L"+bcx+" "+gndY;
}
function wireClip(s,n){ s=String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }

/* ─── 탭 렌더 ─── */
function renderWiring(){
  const boards=state.boards;
  if(boards.length===0) return '<div class="hint">보드가 없습니다. 보드 탭에서 추가하세요.</div>';
  let b=wireBoardObj();
  let h='<div class="card" style="padding:12px 15px;margin-bottom:14px;background:linear-gradient(180deg,rgba(0,255,153,0.05),transparent)">'+
    '<div style="display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:700;font-size:13px;margin-bottom:4px">'+icon("wiring",15)+'와이어링뷰 — 로직 스키매틱</div>'+
    '<div class="hint">보드 핀헤더(D'+sp().pinMin+'~D'+sp().pinMax+') + 장치노드 + 와이어(핀 + GND). 노드를 <b>드래그</b>해 배치하고 <b>클릭</b>하면 장치명·타입을 편집합니다 — 핀맵/레지스트리/HANDOFF와 동일 데이터에 반영됩니다. 이 뷰는 <span class="mono">state.pins</span>로 구동되어 핀맵 편집이 즉시 나타납니다.</div>'+
  '</div>';
  // 툴바: 보드 선택 + 내보내기 + 오토정렬
  h+='<div class="toolbar">'+
    '<span class="lbl">보드</span>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
      boards.map(bb=>{ const c=boardColor(bb); const on=bb.id===b.id;
        return '<button class="btn" data-wboard="'+esc(bb.id)+'" style="'+(on?'border-color:'+c+';color:'+c+';background:'+c+'18':'')+'"><span style="width:8px;height:8px;border-radius:50%;background:'+c+';display:inline-block"></span>'+esc(bb.id)+' · '+bb.role+'</button>'; }).join('')+
    '</div>'+
    '<div style="flex:1"></div>'+
    '<button class="btn btn-ghost" id="w-relayout" title="모든 노드 자동정렬(저장좌표 초기화)">'+icon("wiring",13)+'자동정렬</button>'+
    '<button class="btn btn-accent" id="w-svg">'+icon("download",13)+'SVG</button>'+
    '<button class="btn btn-accent" id="w-png">'+icon("download",13)+'PNG</button>'+
  '</div>';
  // 인라인 편집 패널
  h+='<div id="wire-editor" style="margin-bottom:12px"></div>';
  // 캔버스 (가로 스크롤 컨테이너)
  h+='<div class="card" style="padding:0;overflow:auto;max-height:76vh"><div id="wire-canvas" style="min-width:'+WG.W+'px"></div></div>';
  return h;
}

/* ─── SVG 주입 + 상호작용 ─── */
let _wireDrag=null;
function wireSvgEl(){ return document.getElementById("wire-svg"); }
function drawWireSvg(){
  const b=wireBoardObj(); if(!b) return;
  const host=document.getElementById("wire-canvas"); if(!host) return;
  const m=wireSvgMarkup(b);
  host.innerHTML='<svg id="wire-svg" xmlns="http://www.w3.org/2000/svg" width="'+m.W+'" height="'+m.H+'" viewBox="0 0 '+m.W+' '+m.H+'" style="display:block;font-family:'+WMONO.replace(/"/g,"&quot;")+'">'+m.svg+'</svg>';
  attachWireNodeHandlers();
}
// 화면좌표 → SVG 좌표
function toSvgPoint(svg, clientX, clientY){
  const pt=svg.createSVGPoint(); pt.x=clientX; pt.y=clientY;
  const ctm=svg.getScreenCTM(); if(!ctm) return {x:clientX,y:clientY};
  const p=pt.matrixTransform(ctm.inverse()); return {x:p.x, y:p.y};
}
function attachWireNodeHandlers(){
  const svg=wireSvgEl(); if(!svg) return;
  svg.querySelectorAll('.wnode').forEach(g=>{
    g.addEventListener('pointerdown', onWirePointerDown);
  });
}
function onWirePointerDown(e){
  const g=e.currentTarget; const uid=g.dataset.node;
  const svg=wireSvgEl(); if(!svg) return;
  const b=wireBoardObj(); const p=state.pins.find(x=>x.uid===uid); if(!p) return;
  const nodes=wireNodes(b); const idx=nodes.findIndex(x=>x.uid===uid);
  const start=nodePos(p, idx);
  const sp0=toSvgPoint(svg, e.clientX, e.clientY);
  _wireDrag={ uid, ox:start.x, oy:start.y, sx:sp0.x, sy:sp0.y, moved:0, g, p, b };
  try{ g.setPointerCapture(e.pointerId); }catch(_){}
  g.style.cursor="grabbing";
  g.addEventListener('pointermove', onWirePointerMove);
  g.addEventListener('pointerup', onWirePointerUp);
  g.addEventListener('pointercancel', onWirePointerUp);
  e.preventDefault();
}
function onWirePointerMove(e){
  if(!_wireDrag) return; const svg=wireSvgEl(); if(!svg) return;
  const cur=toSvgPoint(svg, e.clientX, e.clientY);
  let nx=_wireDrag.ox + (cur.x - _wireDrag.sx);
  let ny=_wireDrag.oy + (cur.y - _wireDrag.sy);
  // 캔버스 경계 클램프
  nx=Math.max(WG.boardX+WG.boardW+24, Math.min(nx, WG.W-WG.NW-16));
  ny=Math.max(WG.topY, Math.min(ny, (parseFloat(svg.getAttribute("height"))||1000)-WG.gndPad-WG.NH-10));
  _wireDrag.moved += Math.abs(cur.x-_wireDrag.sx)+Math.abs(cur.y-_wireDrag.sy);
  _wireDrag.g.setAttribute('transform','translate('+nx+','+ny+')');
  _wireDrag.curX=nx; _wireDrag.curY=ny;
  // 라이브: 좌표 저장 + 와이어 갱신
  state.wire.positions[_wireDrag.uid]={x:Math.round(nx),y:Math.round(ny)};
  updateWiresFor(_wireDrag.p, nx, ny);
}
function onWirePointerUp(e){
  if(!_wireDrag) return; const d=_wireDrag; const g=d.g;
  g.style.cursor="grab";
  g.removeEventListener('pointermove', onWirePointerMove);
  g.removeEventListener('pointerup', onWirePointerUp);
  g.removeEventListener('pointercancel', onWirePointerUp);
  try{ g.releasePointerCapture(e.pointerId); }catch(_){}
  const wasClick = d.moved < 5;
  _wireDrag=null;
  if(wasClick){ openWireEditor(d.uid); }
  else { save(); }
}
// 드래그 중 해당 노드의 두 와이어 path 갱신
function updateWiresFor(p, nx, ny){
  const svg=wireSvgEl(); if(!svg) return; const b=wireBoardObj();
  const brx=WG.boardX+WG.boardW; const padTip=brx+WG.padOut;
  const gndY=(parseFloat(svg.getAttribute("height"))||1000)-WG.gndPad;
  const py=pinRowY(p);
  const lcx=nx, lcy=ny+WG.NH/2, bcx=nx+WG.NW/2, bcy=ny+WG.NH;
  const chx=Math.max(padTip+26, nx-28);
  const ws=svg.querySelector('[data-wsig="'+p.uid+'"]'); if(ws) ws.setAttribute('d', sigPath(padTip,py,chx,lcx,lcy));
  const wg=svg.querySelector('[data-wgnd="'+p.uid+'"]'); if(wg) wg.setAttribute('d', gndPath(bcx,bcy,gndY));
}

/* ─── 인라인 노드 편집 (뷰→데이터 반영) ─── */
let _wireSel=null;
function openWireEditor(uid){
  _wireSel=uid; const p=state.pins.find(x=>x.uid===uid); const b=wireBoardObj();
  const host=document.getElementById("wire-editor"); if(!host||!p){ return; }
  const opts=devOptions(b.role); const nhex=nodeHex(p,b); const sid=serialId(p);
  host.innerHTML='<div class="card" style="padding:11px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-color:'+nhex+'55">'+
    '<span class="badge mono" style="background:'+nhex+'22;color:'+nhex+'">'+esc(sid)+'</span>'+
    '<span class="mono" style="color:var(--dim2);font-size:11px">D'+p.pin+' · '+esc(b.id)+'</span>'+
    '<span style="width:1px;height:20px;background:var(--border)"></span>'+
    '<span class="lbl">장치명</span>'+
    '<input id="we-name" class="inp" value="'+esc(p.name)+'" style="width:180px" placeholder="장치명">'+
    '<span class="lbl">타입</span>'+
    '<select id="we-type" class="sel">'+opts.map(d=>'<option value="'+d.ko+'"'+(p.type===d.ko?' selected':'')+'>'+d.ko+' ('+d.code+')</option>').join('')+'</select>'+
    (b.role==="GAMING"?'<span class="lbl">SEQ</span><select id="we-seq" class="sel"><option value="">-</option>'+SEQ_LIST.map(sq=>'<option value="'+sq+'"'+(p.seq===sq?' selected':'')+'>'+sq+' ('+seqToG(sq)+')</option>').join('')+'</select>':'')+
    '<div style="flex:1"></div>'+
    '<span class="hint">클릭 편집 → 핀맵·레지스트리·HANDOFF 동기화</span>'+
    '<button class="btn btn-ghost" id="we-close">닫기</button>'+
  '</div>';
  const nm=document.getElementById("we-name");
  if(nm){ nm.oninput=()=>{ p.name=nm.value; const t=document.getElementById("wlbl-"+uid); if(t) t.textContent=wireClip(p.name||"(무명)",15); save(); }; nm.focus(); }
  const tp=document.getElementById("we-type");
  if(tp) tp.onchange=()=>{ p.type=tp.value; save(); drawWireSvg(); openWireEditor(uid); };
  const sq=document.getElementById("we-seq");
  if(sq) sq.onchange=()=>{ p.seq=sq.value; save(); drawWireSvg(); openWireEditor(uid); };
  const cl=document.getElementById("we-close");
  if(cl) cl.onclick=()=>{ _wireSel=null; host.innerHTML=""; };
}

/* ─── 내보내기 ─── */
function wireStandaloneSVG(){
  const svg=wireSvgEl(); if(!svg) return "";
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
  clone.setAttribute("xmlns:xlink","http://www.w3.org/1999/xlink");
  return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
}
function exportWireSVG(){
  const svgStr=wireStandaloneSVG(); if(!svgStr) return;
  const b=wireBoardObj();
  downloadFile(safeName()+"_wiring_"+(b?b.id:"board")+".svg", svgStr, "image/svg+xml;charset=utf-8");
}
function exportWirePNG(){
  const svg=wireSvgEl(); if(!svg) return;
  const b=wireBoardObj();
  const W=parseFloat(svg.getAttribute("width"))||WG.W;
  const H=parseFloat(svg.getAttribute("height"))||800;
  const scale=2;
  const svgStr=wireStandaloneSVG();
  const blob=new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    try{
      const cv=document.createElement("canvas"); cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
      const ctx=cv.getContext("2d"); ctx.fillStyle="#0a0a0d"; ctx.fillRect(0,0,cv.width,cv.height);
      ctx.setTransform(scale,0,0,scale,0,0); ctx.drawImage(img,0,0);
      cv.toBlob(bl=>{
        if(!bl){ URL.revokeObjectURL(url); return; }
        const purl=URL.createObjectURL(bl);
        const a=document.createElement("a"); a.href=purl; a.download=safeName()+"_wiring_"+(b?b.id:"board")+".png";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>{ URL.revokeObjectURL(purl); URL.revokeObjectURL(url); }, 600);
      }, "image/png");
    }catch(err){ console.warn("png export fail", err); URL.revokeObjectURL(url); }
  };
  img.onerror=()=>{ console.warn("png img load fail"); URL.revokeObjectURL(url); };
  img.src=url;
}

function bindWiring(){
  drawWireSvg();
  if(_wireSel){ const still=state.pins.find(x=>x.uid===_wireSel && x.board===state.meta.wireBoard); if(still) openWireEditor(_wireSel); else _wireSel=null; }
  document.querySelectorAll('[data-wboard]').forEach(btn=>btn.onclick=()=>{
    state.meta.wireBoard=btn.dataset.wboard; _wireSel=null; save(); render();
  });
  const rl=document.getElementById("w-relayout");
  if(rl) rl.onclick=()=>{
    const b=wireBoardObj(); if(!b) return;
    wireNodes(b).forEach(p=>{ delete state.wire.positions[p.uid]; });
    save(); drawWireSvg();
  };
  const sv=document.getElementById("w-svg"); if(sv) sv.onclick=exportWireSVG;
  const pn=document.getElementById("w-png"); if(pn) pn.onclick=exportWirePNG;
}

/* ─── 공통 유틸 ─── */
function safeName(){ return (state.meta.projectName||"project").replace(/\s+/g,"_").replace(/[^0-9A-Za-z가-힣_-]/g,""); }
function downloadFile(fn, text, mime){
  const blob=new Blob([text],{type:mime}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=fn; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 500);
}
function copyText(text, btn){
  const done=()=>{ if(btn){ const o=btn.innerHTML; btn.innerHTML=icon("copy",13)+"복사됨"; setTimeout(()=>btn.innerHTML=o,1200); } };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); }catch(e){} ta.remove(); done&&done();
}

/* ─── per-tab bind dispatcher ─── */
function bindTab(t){
  if(t==="boards") bindBoards();
  else if(t==="pinmap"){ bindPinCommon(); }
  else if(t==="wiring"){ bindWiring(); }
  else if(t==="gaming"){ bindPinCommon(); bindGaming(); }
  else if(t==="protocol") bindProtocol();
  else if(t==="flow") bindFlow();
  else if(t==="registry") bindRegistry();
  else if(t==="handoff") bindHandoff();
}

render();
</script>
