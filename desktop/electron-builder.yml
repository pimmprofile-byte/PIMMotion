appId: works.pimm.pimmotion
productName: PIMMotion
directories:
  output: dist
  buildResources: assets
files:
  - main.js
  - preload.js
  - renderer/**/*
  - "!**/*.map"
# 내부 배포 = 무서명(첫 실행 경고는 우회). 2.0에서 서명·공증 원하면 아래 주석 해제 + secrets.
win:
  target: nsis
  # icon: assets/icon.ico   # 2.0 마스터링: 핌 로고
mac:
  target: dmg
  category: public.app-category.graphics-design
  # icon: assets/icon.icns  # 2.0 마스터링: 핌 로고
  # identity: null          # 무서명(기본). 공증 시 팀 인증서 지정.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
